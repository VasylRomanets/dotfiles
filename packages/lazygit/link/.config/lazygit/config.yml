customCommands:
  - key: 'U'
    context: 'global'
    description: 'Fetch all remotes and fast-forward all local branches'
    output: log
    loadingText: 'Fetching and fast-forwarding branches'
    command: git-ff-all
  - key: 'X'
    context: 'global'
    description: 'Push without hooks (--no-verify)'
    output: log
    loadingText: 'Pushing without hooks'
    prompts:
      - type: 'confirm'
        title: 'Push without hooks'
        body: 'Push the current branch with --no-verify, skipping the pre-push hook?'
    command: git push --no-verify

gui:
  mouseEvents: false
  spinner:
    frames: ['⠋', '⠙', '⠹', '⠸', '⠼', '⠴', '⠦', '⠧', '⠇', '⠏']
    rate: 100

git:
  autoFetch: false
  diffRenderers:
    - command: delta --paging=never --file-style=omit --hunk-header-style="file line-number syntax" --hunk-header-file-style=cyan
      name: unified
    - command: delta --paging=never --file-style=omit --line-numbers
      name: line numbers
    - command: delta --paging=never --file-style=omit --side-by-side --hunk-header-style="file line-number syntax" --hunk-header-file-style=cyan
      name: side-by-side
    - type: rawGit
      args: [--color-words]
      name: color-words

notARepository: quit
promptToReturnFromSubprocess: false

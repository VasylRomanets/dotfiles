# Ayu Dark by Ike Ku (github.com/dempfi/ayu). Terminal colors from Ghostty's built-in Ayu theme; syntax colors from the author's Sublime Text color scheme.

name = "Ayu Dark"
variant = "dark"
url = "https://github.com/dempfi/ayu"
description = "Modern, bright color theme with a near-black background, the darkest of Ayu's three variants."

[ansi]
black = "#11151c"
red = "#ea6c73"
green = "#7fd962"
yellow = "#f9af4f"
blue = "#53bdfa"
magenta = "#cda1fa"
cyan = "#90e1c6"
white = "#c7c7c7"
bright-black = "#686868"
bright-red = "#f07178"
bright-green = "#aad94c"
bright-yellow = "#ffb454"
bright-blue = "#59c2ff"
bright-magenta = "#d2a6ff"
bright-cyan = "#95e6cb"
bright-white = "#ffffff"

[ui]
background = "#0b0e14"
foreground = "#bfbdb6"
foreground-light = "#dcdad7"
accent = "#e6b450"
selection-bg = "#193155"
selection-fg = "#bfbdb6"
line-highlight = "#161a24"
cursor = "#e6b450"
border = "#333438"
gutter-bg = "#0b0e14"
gutter-fg = "#5a6673"
chrome-bg = "#16181e"
chrome-bg-dark = "#080a0e"

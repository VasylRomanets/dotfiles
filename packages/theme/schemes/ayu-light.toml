# Ayu Light by Ike Ku (github.com/dempfi/ayu). Terminal colors from Ghostty's built-in Ayu theme; syntax colors from the author's Sublime Text color scheme.

name = "Ayu Light"
variant = "light"
url = "https://github.com/dempfi/ayu"
description = "Modern, bright color theme on a clean light background."

[ansi]
black = "#000000"
red = "#ea6c6d"
green = "#6cbf43"
yellow = "#eca944"
blue = "#3199e1"
magenta = "#9e75c7"
cyan = "#46ba94"
white = "#bababa"
bright-black = "#686868"
bright-red = "#f07171"
bright-green = "#86b300"
bright-yellow = "#f2ae49"
bright-blue = "#399ee6"
bright-magenta = "#a37acc"
bright-cyan = "#4cbf99"
bright-white = "#d1d1d1"

[ui]
background = "#f8f9fa"
foreground = "#5c6166"
foreground-light = "#3f4246"
accent = "#f29718"
selection-bg = "#d7e4f6"
selection-fg = "#5c6166"
line-highlight = "#f0f1f3"
cursor = "#f29718"
border = "#d6d8d9"
gutter-bg = "#f8f9fa"
gutter-fg = "#adaeb1"
chrome-bg = "#eff0f1"

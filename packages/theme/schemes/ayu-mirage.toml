# Ayu Mirage by Ike Ku (github.com/dempfi/ayu). Terminal colors from Ghostty's built-in Ayu theme; syntax colors from the author's Sublime Text color scheme.

name = "Ayu Mirage"
variant = "dark"
url = "https://github.com/dempfi/ayu"
description = "Modern, bright color theme with a softer, blue-grey background."

[ansi]
black = "#171b24"
red = "#ed8274"
green = "#87d96c"
yellow = "#facc6e"
blue = "#6dcbfa"
magenta = "#dabafa"
cyan = "#90e1c6"
white = "#c7c7c7"
bright-black = "#686868"
bright-red = "#f28779"
bright-green = "#d5ff80"
bright-yellow = "#ffd173"
bright-blue = "#73d0ff"
bright-magenta = "#dfbfff"
bright-cyan = "#95e6cb"
bright-white = "#ffffff"

[ui]
background = "#1f2430"
foreground = "#cccac2"
foreground-light = "#e8e7e3"
accent = "#ffcc66"
selection-bg = "#2b4768"
selection-fg = "#cccac2"
line-highlight = "#1a1f29"
cursor = "#ffcc66"
border = "#454950"
gutter-bg = "#1f2430"
gutter-fg = "#6e7c8f"
chrome-bg = "#292e39"
chrome-bg-dark = "#161922"
chrome-fg-dark = "#8f908f"
whitespace = "#6e7c8f"
error = "#ed8274"
warning = "#facc6e"
success = "#87d96c"

# Belafonte by Jan T. Sott (idleberg), from his Zissou collection for iTerm2, under CC BY-SA 4.0. The collection has only the 16 terminal colors, so the syntax mapping is derived from them, with colors too faint against the background nudged until they read.

name = "Belafonte Day"
variant = "light"
url = "https://github.com/idleberg/Zissou-iTerm2"
description = "Sun-bleached daylight aboard the Belafonte from The Life Aquatic: sandy paper, brown ink and rust."

[ansi]
black = "#20111b"
red = "#be100e"
green = "#858162"
yellow = "#d08b30"
blue = "#426a79"
magenta = "#97522c"
cyan = "#989a9c"
white = "#968c83"

# Converted from the upstream Omarchy theme's Ghostty config and Coppernight.tmTheme.

scheme:
  system: "tinted8"
  supports:
    styling-spec: "0.2.0"
  author: "Vasyl Romanets"
  theme-author: "https://github.com/hembramnishant50-glitch/omarchy-coppernight-theme"
  name: "Coppernight"
  slug: "coppernight"
variant: "dark"
palette:
  black: "#11111b"
  white: "#cad3f5"
  red: "#ed8796"
  red-bright: "#ed8796"
  green: "#a6da95"
  green-bright: "#a6da95"
  yellow: "#eed49f"
  yellow-bright: "#fab387"
  blue: "#8aadf4"
  blue-bright: "#8aadf4"
  magenta: "#c6a0f6"
  magenta-bright: "#c6a0f6"
  cyan: "#8bd5ca"
  cyan-bright: "#8bd5ca"
  gray: "#a5adcb"
  orange: "#fab387"
syntax:
  comment: "#a5adcb"
  invalid: "#cad3f5"
  invalid.illegal: "#ed8796"
  string: "#a6da95"
  constant: "#cad3f5"
  constant.numeric: "#fab387"
  entity: "#cad3f5"
  entity.name.class: "#eed49f"
  entity.name.function: "#8aadf4"
  entity.name.tag: "#8aadf4"
  entity.name.type: "#eed49f"
  keyword: "#c6a0f6"
  keyword.operator: "#8bd5ca"
  storage: "#cad3f5"
  storage.type: "#c6a0f6"
  support: "#cad3f5"
  support.class: "#eed49f"
  variable: "#cad3f5"
  variable.other.constant: "#fab387"
  punctuation: "#8bd5ca"
  punctuation.definition.comment: "#a5adcb"
  markup: "#cad3f5"
  markup.bold: "#8aadf4"
  markup.heading: "#8aadf4"
  markup.inserted: "#a6da95"
  markup.deleted: "#ed8796"
  source: "#cad3f5"
  text: "#cad3f5"
  meta: "#cad3f5"
ui:
  accent:
    normal: "#fab387"
  selection:
    background: "#313244"
  highlight:
    line:
      background: "#181825"
  cursor:
    normal:
      background: "#ed8796"
  border:
    normal: "#3a3c4b"
  gutter:
    foreground: "#a5adcb"
  chrome:
    background:
      normal: "#1c1d28"
      dark: "#0c0c13"
    foreground:
      dark: "#898fa9"

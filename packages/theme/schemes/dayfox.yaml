# Converted from dayfox.tmTheme and Ghostty theme Dayfox.

scheme:
  system: "tinted8"
  supports:
    styling-spec: "0.2.0"
  author: "Vasyl Romanets"
  theme-author: "https://github.com/EdenEast/nightfox.nvim"
  name: "Dayfox"
  slug: "dayfox"
variant: "light"
palette:
  black: "#3d2b5a"
  white: "#f6f2ee"
  red: "#a5222f"
  red-bright: "#b3434e"
  green: "#396847"
  green-bright: "#577f63"
  yellow: "#ac5402"
  yellow-bright: "#b86e28"
  blue: "#2848a9"
  blue-bright: "#4863b6"
  magenta: "#6e33ce"
  magenta-bright: "#8452d5"
  cyan: "#287980"
  cyan-bright: "#488d93"
  gray: "#aab0ad"
  orange: "#ac5402"
syntax:
  comment: "#aab0ad"
  invalid: "#302b5d"
  string: "#396847"
  constant: "#302b5d"
  constant.numeric: "#ac5402"
  constant.language: "#a5222f"
  constant.character.escape: "#643f61"
  entity: "#302b5d"
  entity.name.class: "#ac5402"
  entity.name.function: "#223d90"
  entity.name.tag: "#223d90"
  entity.name.type: "#ac5402"
  entity.name.namespace: "#ac5402"
  entity.other.attribute-name: "#ac5402"
  entity.other.inherited-class: "#ac5402"
  keyword: "#6e33ce"
  keyword.operator: "#287980"
  storage: "#302b5d"
  storage.type: "#6e33ce"
  storage.modifier: "#6e33ce"
  support: "#302b5d"
  support.function: "#223d90"
  support.function.builtin: "#a5222f"
  support.class: "#ac5402"
  support.type: "#ac5402"
  variable: "#302b5d"
  variable.parameter: "#8b369a"
  variable.other.constant: "#ac5402"
  punctuation: "#302b5d"
  punctuation.definition.string: "#396847"
  punctuation.definition.comment: "#aab0ad"
  markup: "#302b5d"
  markup.bold: "#a5222f"
  markup.italic: "#a5222f"
  markup.quote: "#643f61"
  markup.link: "#b7bdf8"
  source: "#302b5d"
  text: "#302b5d"
  meta: "#302b5d"
  meta.type: "#ac5402"
ui:
  accent:
    normal: "#287980"
  selection:
    background: "#302b5d"
  highlight:
    line:
      background: "#dbd1dd"
  cursor:
    normal:
      background: "#824d5b"
  border:
    normal: "#cdc6cd"
  gutter:
    foreground: "#aab0ad"
  chrome:
    background:
      normal: "#ebe6e5"
      dark: "#e4dedf"
    foreground:
      dark: "#7e718e"

# Converted from duskfox.tmTheme and Ghostty theme Duskfox.

scheme:
  system: "tinted8"
  supports:
    styling-spec: "0.2.0"
  author: "Vasyl Romanets"
  theme-author: "https://github.com/EdenEast/nightfox.nvim"
  name: "Duskfox"
  slug: "duskfox"
variant: "dark"
palette:
  black: "#232136"
  white: "#e0def4"
  red: "#eb6f92"
  red-bright: "#f083a2"
  green: "#a3be8c"
  green-bright: "#b1d196"
  yellow: "#f6c177"
  yellow-bright: "#f9cb8c"
  blue: "#569fba"
  blue-bright: "#65b1cd"
  magenta: "#c4a7e7"
  magenta-bright: "#ccb1ed"
  cyan: "#9ccfd8"
  cyan-bright: "#a6dae3"
  gray: "#817c9c"
syntax:
  comment: "#817c9c"
  invalid: "#f083a2"
  invalid.deprecated: "#6e6a86"
  string: "#a3be8c"
  string.regexp: "#f9cb8c"
  constant: "#e0def4"
  constant.numeric: "#ea9a97"
  constant.language: "#f0a4a2"
  constant.character: "#f0a4a2"
  constant.character.escape: "#f083a2"
  constant.other: "#f0a4a2"
  entity: "#e0def4"
  entity.name.class: "#f6c177"

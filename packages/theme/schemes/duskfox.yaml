  entity.name.tag: "#9ccfd8"
  entity.other.attribute-name: "#f6c177"
  entity.other.inherited-class: "#f6c177"
  keyword: "#c4a7e7"
  storage: "#c4a7e7"
  storage.type: "#f6c177"
  support: "#e0def4"
  support.function: "#65b1cd"
  support.class: "#f6c177"
  support.type: "#f6c177"
  support.constant: "#f0a4a2"
  variable: "#e0def4"
  variable.parameter: "#cdcbe0"
  punctuation: "#e0def4"
  punctuation.definition.string: "#a3be8c"
  punctuation.definition.comment: "#817c9c"
  markup: "#e0def4"
  source: "#e0def4"
  text: "#e0def4"
  meta: "#e0def4"

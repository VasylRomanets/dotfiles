# Ethereal by bjarneo (github.com/bjarneo/ethereal-vscode), the theme bundled with Omarchy. Terminal colors from Omarchy's colors.toml; syntax colors from the author's VS Code theme.

name = "Ethereal"
variant = "dark"
url = "https://github.com/bjarneo/ethereal-vscode"

[ansi]
black = "#060b1e"
red = "#ed5b5a"
green = "#92a593"
yellow = "#e9bb4f"
blue = "#7d82d9"
magenta = "#c89dc1"
cyan = "#a3bfd1"
white = "#ffcead"
bright-black = "#6d7db6"
bright-red = "#faaaa9"
bright-green = "#c4cfc4"
bright-yellow = "#f7dc9c"
bright-blue = "#c2c4f0"
bright-magenta = "#ead7e7"
bright-cyan = "#dfeaf0"
bright-white = "#ffcead"

[ui]
background = "#060b1e"
foreground = "#ffcead"
foreground-light = "#fff3ea"
accent = "#7d82d9"
selection-bg = "#252e56"
selection-fg = "#ffcead"
line-highlight = "#151727"
cursor = "#ffcead"
border = "#3d363d"
gutter-bg = "#060b1e"

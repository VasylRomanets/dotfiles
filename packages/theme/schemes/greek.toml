# Greek by HANCORE-linux, MIT. The terminal colors are the Ghostty file of its Omarchy theme, the syntax colors those of its VS Code theme. The theme's ANSI hues are shuffled, so error, warning, success and the diff colors come from the author's own role palette.

name = "Greek"
variant = "light"
url = "https://github.com/HANCORE-linux/omarchy-thegreek-theme"
description = "A minimal espionage-inspired light theme: sand-grey paper, dark olive ink and a burnt-orange accent."


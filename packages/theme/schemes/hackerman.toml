# Hackerman by bjarneo (github.com/bjarneo/hackerman-vscode), the theme bundled with Omarchy. Terminal colors from Omarchy's colors.toml; syntax colors from the author's VS Code theme.

name = "Hackerman"
variant = "dark"
url = "https://github.com/bjarneo/hackerman-vscode"

[ansi]
black = "#0b0c16"
red = "#50f872"
green = "#4fe88f"
yellow = "#50f7d4"
blue = "#829dd4"
magenta = "#86a7df"
cyan = "#7cf8f7"
white = "#ddf7ff"
bright-black = "#2d3450"
bright-red = "#85ff9d"
bright-green = "#9cf7c2"
bright-yellow = "#a4ffec"
bright-blue = "#c4d2ed"
bright-magenta = "#cddbf4"
bright-cyan = "#d1fffe"
bright-white = "#ddf7ff"

[ui]
background = "#0b0c16"
foreground = "#ddf7ff"
foreground-light = "#ffffff"
accent = "#82fb9c"
selection-bg = "#1f253a"
selection-fg = "#ddf7ff"
line-highlight = "#181a24"
cursor = "#ddf7ff"
border = "#394049"
gutter-bg = "#0b0c16"

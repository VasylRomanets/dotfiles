# Harbor Dark by HANCORE-linux, MIT. The terminal colors are the terminal colors of its VS Code theme, the syntax colors those of its VS Code theme, with faint ones nudged until they read.

name = "Harbor Dark"
variant = "dark"
url = "https://github.com/HANCORE-linux/omarchy-harbordark-theme"
description = "The dark version of Harbor: cream text with salmon and khaki accents on near-black."


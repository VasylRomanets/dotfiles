# Harbor Light by HANCORE-linux, MIT. The terminal colors are the Ghostty file of its Omarchy theme, the syntax colors those of its VS Code theme, with faint ones nudged until they read.

name = "Harbor Light"
variant = "light"
url = "https://github.com/HANCORE-linux/omarchy-harbor-theme"
description = "A calm, paper-light scheme with cool ink accents, inspired by Nordic tones."

[ansi]
black = "#dfe4c4"
red = "#b14752"
green = "#556753"
yellow = "#dc8164"
blue = "#4c6c94"
magenta = "#8a5b81"
cyan = "#3d727d"
white = "#384f54"
bright-black = "#7d8794"
bright-red = "#b14752"
bright-green = "#556753"
bright-yellow = "#dc8164"
bright-blue = "#4c6c94"
bright-magenta = "#8a5b81"
bright-cyan = "#3d727d"
bright-white = "#1c2d28"

[ui]

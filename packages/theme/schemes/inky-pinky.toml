# Inky Pinky by HANCORE-linux, MIT. The terminal colors are the colors.toml of its Omarchy theme, the syntax colors those of its Aether-generated Zed theme, with faint ones nudged until they read.

name = "Inky Pinky"
variant = "dark"
url = "https://github.com/HANCORE-linux/omarchy-inkypinky-theme"
description = "Blush pinks and dusty lavender on deep midnight blue, soft with a touch of boldness."

[ansi]
black = "#13131d"
red = "#ea90a8"
green = "#a6b2c7"
yellow = "#d18ba2"
blue = "#7c7ca8"
magenta = "#9f859f"
cyan = "#919ab7"
white = "#a1a2a7"

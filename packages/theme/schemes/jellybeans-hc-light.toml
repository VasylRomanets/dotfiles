# Jellybeans by nanotech (github.com/nanotech/jellybeans.vim). This variant is WTFox's jellybeans.nvim palette (Apache-2.0), with the terminal colors of its Ghostty theme jellybeans-hc-light. The syntax colors follow the plugin's highlight groups, with faint ones nudged until they read.

name = "Jellybeans HC Light"
variant = "light"
url = "https://github.com/WTFox/jellybeans.nvim"
description = "High-contrast Jellybeans on near-white, with deeper accents for strong contrast."

[ansi]
black = "#f5f5f5"
red = "#c00000"
green = "#507020"
yellow = "#7a5000"
blue = "#1a3a80"
magenta = "#4a2090"
cyan = "#306070"
white = "#000000"
bright-black = "#707070"
bright-red = "#8a1010"
bright-green = "#1f5d10"
bright-yellow = "#8a5000"
bright-blue = "#0a4a7a"
bright-magenta = "#600080"
bright-cyan = "#0a4a7a"
bright-white = "#505050"

[ui]
background = "#fafafa"
foreground = "#000000"
foreground-light = "#000000"
accent = "#0a3a8a"
selection-bg = "#e8d0c0"
selection-fg = "#000000"
line-highlight = "#ebebeb"
cursor = "#0a3a8a"
border = "#c3c3c3"
gutter-bg = "#fafafa"
gutter-fg = "#707070"
chrome-bg = "#ebebeb"
chrome-bg-dark = "#e1e1e1"
chrome-fg-dark = "#585858"
whitespace = "#707070"
error = "#c00000"
warning = "#7a5000"
success = "#507020"
diff-added = "#507020"
diff-removed = "#c00000"


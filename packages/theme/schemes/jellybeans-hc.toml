# Jellybeans by nanotech (github.com/nanotech/jellybeans.vim). This variant is WTFox's jellybeans.nvim palette (Apache-2.0), with the terminal colors of its Ghostty theme jellybeans-hc. The syntax colors follow the plugin's highlight groups, with faint ones nudged until they read.

name = "Jellybeans HC"
variant = "dark"
url = "https://github.com/WTFox/jellybeans.nvim"
description = "High-contrast Jellybeans: a near-black background and more saturated accents."

[ansi]
black = "#060606"
red = "#ff5050"
green = "#c0d880"
yellow = "#ffe080"
blue = "#98b0e0"
magenta = "#d8c8ff"
cyan = "#78a0b8"
white = "#f8f8f0"
bright-black = "#909090"
bright-red = "#b02020"
bright-green = "#8cd468"
bright-yellow = "#ffc060"
bright-blue = "#aad4f8"
bright-magenta = "#8800a8"
bright-cyan = "#aad4f8"
bright-white = "#f8f8f8"

[ui]
background = "#060606"
foreground = "#f8f8f0"
foreground-light = "#ffffff"
accent = "#c0e0ff"
selection-bg = "#303030"
selection-fg = "#f8f8f0"
line-highlight = "#151514"
cursor = "#c0e0ff"
border = "#3b3b39"
gutter-bg = "#060606"
gutter-fg = "#909090"
chrome-bg = "#151514"
chrome-bg-dark = "#040404"
chrome-fg-dark = "#a3a39e"
whitespace = "#909090"
error = "#ff5050"
warning = "#ffe080"
success = "#c0d880"
diff-added = "#c0d880"
diff-removed = "#ff5050"

[syntax]
"comment" = "#909090"
"comment.line" = "#909090"
"comment.block" = "#909090"

# Jellybeans by nanotech (github.com/nanotech/jellybeans.vim). This variant is WTFox's jellybeans.nvim palette (Apache-2.0), with the terminal colors of its Ghostty theme jellybeans-light. The syntax colors follow the plugin's highlight groups, with faint ones nudged until they read.

name = "Jellybeans Light"
variant = "light"
url = "https://github.com/WTFox/jellybeans.nvim"
description = "Vibrant Jellybeans by daylight: the same hues, deepened to read on warm cream paper."

[ansi]
black = "#f5f5f5"
red = "#ff3333"
green = "#386014"
yellow = "#876820"
blue = "#2952a3"
magenta = "#6a4abd"
cyan = "#2b5b77"
white = "#252525"
bright-black = "#787878"
bright-red = "#a02020"
bright-green = "#457039"
bright-yellow = "#b87520"
bright-blue = "#234291"
bright-magenta = "#5a0069"
bright-cyan = "#3a596a"
bright-white = "#000000"

[ui]
background = "#f5e6d3"
foreground = "#252525"
foreground-light = "#060606"
accent = "#234291"
selection-bg = "#d7af87"
selection-fg = "#252525"
line-highlight = "#e9dac9"
cursor = "#234291"
border = "#c7bcad"
gutter-bg = "#f5e6d3"

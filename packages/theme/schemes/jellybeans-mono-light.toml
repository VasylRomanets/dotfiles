# Jellybeans by nanotech (github.com/nanotech/jellybeans.vim). This variant is WTFox's jellybeans.nvim palette (Apache-2.0), with the terminal colors of its Ghostty theme jellybeans-mono-light. The syntax colors follow the plugin's highlight groups, with faint ones nudged until they read.

name = "Jellybeans Mono Light"
variant = "light"
url = "https://github.com/WTFox/jellybeans.nvim"
description = "The monochrome Jellybeans on warm off-white, with brown and slate-blue accents."

[ansi]
black = "#f5f5f5"
red = "#cc0000"
green = "#7d7163"
yellow = "#6a6564"
blue = "#4a5e81"
magenta = "#555555"
cyan = "#576270"
white = "#252525"
bright-black = "#787878"
bright-red = "#ffe5ea"
bright-green = "#3d6c25"
bright-yellow = "#707070"
bright-blue = "#4a5e81"
bright-magenta = "#909090"
bright-cyan = "#645c54"
bright-white = "#000000"

[ui]
background = "#f5f0e8"
foreground = "#252525"
foreground-light = "#060606"
accent = "#4a5e81"
selection-bg = "#d8c8b8"
selection-fg = "#252525"
line-highlight = "#e9e4dc"
cursor = "#4a5e81"
border = "#c7c3bd"

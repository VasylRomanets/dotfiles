# Jellybeans by nanotech (github.com/nanotech/jellybeans.vim). This variant is WTFox's jellybeans.nvim palette (Apache-2.0), with the terminal colors of its Ghostty theme jellybeans-mono. The syntax colors follow the plugin's highlight groups, with faint ones nudged until they read.

name = "Jellybeans Mono"
variant = "dark"
url = "https://github.com/WTFox/jellybeans.nvim"
description = "Jellybeans stripped to grays and two accents, brown and slate blue, on a dark background."

[ansi]
black = "#151515"
red = "#c95c5c"
green = "#b39066"
yellow = "#ccc5c4"
blue = "#7a8aa6"
magenta = "#c7c7c7"
cyan = "#556779"
white = "#e8e8d3"
bright-black = "#888888"
bright-red = "#40000a"
bright-green = "#afd787"
bright-yellow = "#888888"
bright-blue = "#7a8aa6"
bright-magenta = "#606060"
bright-cyan = "#a0a8b0"
bright-white = "#f0f0f0"

[ui]
background = "#151515"
foreground = "#e8e8d3"
foreground-light = "#fdfdfb"
accent = "#7a8aa6"
selection-bg = "#404040"
selection-fg = "#e8e8d3"
line-highlight = "#222220"
cursor = "#7a8aa6"
border = "#43433f"
gutter-bg = "#151515"

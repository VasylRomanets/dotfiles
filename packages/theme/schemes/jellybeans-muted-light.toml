# Jellybeans by nanotech (github.com/nanotech/jellybeans.vim). This variant is WTFox's jellybeans.nvim palette (Apache-2.0), with the terminal colors of its Ghostty theme jellybeans-muted-light. The syntax colors follow the plugin's highlight groups, with faint ones nudged until they read.

name = "Jellybeans Muted Light"
variant = "light"
url = "https://github.com/WTFox/jellybeans.nvim"
description = "Muted Jellybeans on soft off-white, with dimmed hues and the contrast kept."

[ansi]
black = "#fdfdfa"
red = "#b84949"
green = "#6d7f59"
yellow = "#987b40"
blue = "#445987"
magenta = "#655683"
cyan = "#3c5971"
white = "#2d2c2a"
bright-black = "#787775"
bright-red = "#913a34"
bright-green = "#4d7134"
bright-yellow = "#a07542"
bright-blue = "#334a84"
bright-magenta = "#542258"
bright-cyan = "#3a6f8c"
bright-white = "#0f0e0d"


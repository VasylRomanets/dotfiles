# Jellybeans by nanotech (github.com/nanotech/jellybeans.vim). This variant is WTFox's jellybeans.nvim palette (Apache-2.0), with the terminal colors of its Ghostty theme jellybeans-muted. The syntax colors follow the plugin's highlight groups, with faint ones nudged until they read.

name = "Jellybeans Muted"
variant = "dark"
url = "https://github.com/WTFox/jellybeans.nvim"
description = "Jellybeans with the saturation turned down for a calmer, paper-like feel on near-black."

[ansi]
black = "#101010"
red = "#cc4d4d"
green = "#909c6e"
yellow = "#e8c88c"
blue = "#7a8aa6"
magenta = "#b8aed3"
cyan = "#617b87"
white = "#dad6c8"
bright-black = "#7a7a7a"
bright-red = "#7e2e23"
bright-green = "#98b67c"
bright-yellow = "#d8a16c"
bright-blue = "#83adc3"
bright-magenta = "#5c1e68"
bright-cyan = "#7db7cc"
bright-white = "#f9f5ec"

[ui]
background = "#101010"
foreground = "#dad6c8"
foreground-light = "#f3f1ed"
accent = "#a6c3d9"
selection-bg = "#3c3b38"

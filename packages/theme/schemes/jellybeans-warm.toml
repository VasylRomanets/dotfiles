# Jellybeans by nanotech (github.com/nanotech/jellybeans.vim). This variant is WTFox's jellybeans.nvim palette (Apache-2.0), with the terminal colors of its Ghostty theme jellybeans-warm. The syntax colors follow the plugin's highlight groups, with faint ones nudged until they read.

name = "Jellybeans Warm"
variant = "dark"
url = "https://github.com/WTFox/jellybeans.nvim"
description = "Jellybeans with its neutrals shifted toward amber and espresso."

[ansi]
black = "#1c1510"
red = "#d74545"
green = "#99ad6a"
yellow = "#fad07a"
blue = "#8197bf"
magenta = "#c6b6ee"
cyan = "#668799"
white = "#edd9b8"
bright-black = "#8a8070"
bright-red = "#902020"
bright-green = "#70b950"
bright-yellow = "#e6a75a"
bright-blue = "#8fbfdc"
bright-magenta = "#700089"
bright-cyan = "#8fbfdc"
bright-white = "#f0e4d0"

[ui]
background = "#1c1510"
foreground = "#edd9b8"
foreground-light = "#f9f3e9"
accent = "#c8b878"
selection-bg = "#4a3828"

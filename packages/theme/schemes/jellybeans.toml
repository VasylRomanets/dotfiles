# Jellybeans by nanotech (github.com/nanotech/jellybeans.vim). This variant is WTFox's jellybeans.nvim palette (Apache-2.0), with the terminal colors of its Ghostty theme jellybeans. The syntax colors follow the plugin's highlight groups, with faint ones nudged until they read.

name = "Jellybeans"
variant = "dark"
url = "https://github.com/WTFox/jellybeans.nvim"
description = "The classic Jellybeans: saturated pastels on near-black, inspired by ir_black and Twilight."

[ansi]
black = "#151515"
red = "#d74545"
green = "#99ad6a"
yellow = "#fad07a"
blue = "#8197bf"
magenta = "#c6b6ee"
cyan = "#668799"
white = "#e8e8d3"
bright-black = "#888888"
bright-red = "#902020"
bright-green = "#70b950"
bright-yellow = "#e6a75a"
bright-blue = "#8fbfdc"
bright-magenta = "#700089"
bright-cyan = "#8fbfdc"
bright-white = "#f0f0f0"

[ui]
background = "#151515"
foreground = "#e8e8d3"
foreground-light = "#fdfdfb"
accent = "#b0d0f0"
selection-bg = "#404040"
selection-fg = "#e8e8d3"
line-highlight = "#222220"
cursor = "#b0d0f0"
border = "#43433f"
gutter-bg = "#151515"

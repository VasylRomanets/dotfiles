# Converted from kanso-ink.tmTheme and Ghostty theme kanso-ink.ghostty.

name = "Kanso Ink"
variant = "dark"
url = "https://github.com/webhooked/kanso.nvim"
description = "An elegant evolution of the Kanagawa theme: a dark theme that invites focus, not attention."


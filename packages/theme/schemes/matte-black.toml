# Matte Black by tahayvr (https://github.com/tahayvr/matte-black-theme). Terminal colors from its Ghostty config; syntax colors follow the author's matteblack.nvim (the theme has no .tmTheme).

name = "Matte Black"
variant = "dark"
url = "https://github.com/tahayvr/matte-black-theme"
description = "A low distraction dark theme."

[ansi]
black = "#333333"
red = "#d35f5f"
green = "#ffc107"
yellow = "#b91c1c"
blue = "#e68e0d"
magenta = "#d35f5f"
cyan = "#bebebe"
white = "#bebebe"
bright-black = "#8a8a8d"
bright-red = "#b91c1c"
bright-green = "#ffc107"
bright-yellow = "#b90a0a"
bright-blue = "#f59e0b"
bright-magenta = "#b91c1c"
bright-cyan = "#eaeaea"
bright-white = "#ffffff"

[ui]
background = "#121212"
foreground = "#bebebe"
foreground-light = "#dddddd"
accent = "#f59e0b"
selection-bg = "#333333"
selection-fg = "#bebebe"
line-highlight = "#212121"
cursor = "#f59e0b"
border = "#383838"
gutter-bg = "#121212"
gutter-fg = "#8a8a8d"
chrome-bg = "#1c1c1c"
chrome-bg-dark = "#0d0d0d"

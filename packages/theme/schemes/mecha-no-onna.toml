# Mecha no Onna (V2) by HANCORE-linux, MIT. The terminal colors are the Ghostty file of its Omarchy theme, the syntax colors those of its generated VS Code theme, with faint ones nudged until they read.

name = "Mecha no Onna"
variant = "dark"
url = "https://github.com/HANCORE-linux/omarchy-mechanoonna-theme"
description = "Warm amber and sand tones on near-black, a cyber-samurai look from an Omarchy desktop theme."


# Mellow by kvrohit (Rohit K Viswanath), MIT. Colors are the light palette of mellow.nvim, and the syntax colors follow its highlight groups.

name = "Mellow Light"
variant = "light"
url = "https://github.com/mellow-theme/mellow.nvim"
description = "The light side of Mellow: the same soft accents, deepened to read on near-white."

[ansi]
black = "#f4f4f4"
red = "#e05439"
green = "#598c15"
yellow = "#c65c00"
blue = "#174c97"
magenta = "#bf386e"
cyan = "#d82b65"
white = "#5a5a5e"
bright-black = "#fafafa"
bright-red = "#ff684b"
bright-green = "#6fa32b"
bright-yellow = "#f27306"
bright-blue = "#215fac"
bright-magenta = "#d55488"
bright-cyan = "#f73e7c"
bright-white = "#6f6f74"

[ui]

# Mellow by kvrohit (Rohit K Viswanath), MIT. Colors are the dark palette of mellow.nvim, and the syntax colors follow its highlight groups.

name = "Mellow"
variant = "dark"
url = "https://github.com/mellow-theme/mellow.nvim"
description = "A soothing dark scheme: soft peach, sage and lilac pastels on a near-black background."

[ansi]
black = "#27272a"
red = "#f5a191"
green = "#90b99f"
yellow = "#e6b99d"
blue = "#aca1cf"
magenta = "#e29eca"
cyan = "#ea83a5"
white = "#c1c0d4"
bright-black = "#353539"
bright-red = "#ffae9f"
bright-green = "#9dc6ac"
bright-yellow = "#f0c5a9"
bright-blue = "#b9aeda"
bright-magenta = "#ecaad6"
bright-cyan = "#f591b2"
bright-white = "#cac9dd"

[ui]

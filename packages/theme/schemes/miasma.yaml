# Converted from miasma.tmTheme and Ghostty theme Miasma.

scheme:
  system: "tinted8"
  supports:
    styling-spec: "0.2.0"
  author: "Vasyl Romanets"
  theme-author: "https://github.com/xero/miasma.nvim"
  name: "Miasma"
  slug: "miasma"
variant: "dark"
palette:
  black: "#222222"
  white: "#c2c2b0"
  red: "#685742"
  red-bright: "#685742"
  green: "#5f875f"
  green-bright: "#5f875f"
  yellow: "#b36d43"
  yellow-bright: "#b36d43"
  blue: "#78824b"
  blue-bright: "#78824b"
  magenta: "#bb7744"
  magenta-bright: "#bb7744"
  cyan: "#c9a554"
  cyan-bright: "#c9a554"
  gray: "#666666"
syntax:
  comment: "#666666"
  invalid: "#b36d43"
  invalid.deprecated: "#666666"
  string: "#685742"
  string.regexp: "#bb7744"
  constant: "#c2c2b0"
  constant.numeric: "#78824b"
  constant.language: "#bb7744"
  constant.character: "#bb7744"
  constant.character.escape: "#b36d43"
  constant.other: "#bb7744"
  entity: "#c2c2b0"
  entity.name.class: "#78824b"
  entity.name.function: "#78824b"
  entity.name.tag: "#5f875f"
  entity.other.attribute-name: "#5f875f"
  entity.other.inherited-class: "#78824b"
  keyword: "#5f875f"
  storage: "#78824b"
  support: "#c2c2b0"
  support.function: "#78824b"
  support.class: "#78824b"
  support.type: "#78824b"
  support.constant: "#bb7744"
  variable: "#d7c483"
  variable.parameter: "#c2c2b0"
  punctuation: "#c2c2b0"
  punctuation.definition.string: "#685742"
  punctuation.definition.comment: "#666666"
  markup: "#c2c2b0"
  source: "#c2c2b0"
  text: "#c2c2b0"
  meta: "#c2c2b0"
ui:
  accent:
    normal: "#78824b"
  selection:
    background: "#78824b"
  highlight:
    line:
      background: "#1c1c1c"
  cursor:
    normal:
      background: "#d7c483"
  border:
    normal: "#454541"
  gutter:
    foreground: "#666666"
  chrome:
    background:
      normal: "#2c2c2b"
      dark: "#181818"
    foreground:
      dark: "#8a8a7e"

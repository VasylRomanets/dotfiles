# Neon Blade Runner, from the palette of Tom di Mino's cliamp theme (pink neon, teal rain, amber readouts). That file has only six colors, so blue, cyan, the bright colors, the selection and the syntax mapping are derived.

name = "Neon Blade Runner"
variant = "dark"
url = "https://github.com/bjarneo/cliamp/blob/main/theme/themes/neon-blade-runner.toml"
description = "Neon noir from Blade Runner (1982): hot pink signs, cyan rain and amber readouts."

[ansi]
black = "#121212"
red = "#d65f7e"
green = "#4eb8a8"
yellow = "#d4a040"
blue = "#5f87b5"
magenta = "#e8609a"
cyan = "#5cc8d0"
white = "#b8c4d0"

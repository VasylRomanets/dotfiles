bright-red = "#ee7a96"
bright-green = "#6fd0c0"
bright-yellow = "#e6b85c"
bright-blue = "#8aa9d0"
bright-magenta = "#f27fb2"
bright-cyan = "#85dce2"
bright-white = "#dfe6ee"

[ui]

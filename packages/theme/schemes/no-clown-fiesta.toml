# Converted from no-clown-fiesta.tmTheme and Ghostty theme No Clown Fiesta.

name = "No Clown Fiesta"
variant = "dark"
url = "https://github.com/no-clown-fiesta/no-clown-fiesta.nvim"
description = "A dark theme that avoids looking like a clown fiesta."


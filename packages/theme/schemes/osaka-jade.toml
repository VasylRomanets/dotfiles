# Palette from the Omarchy theme's colors.toml; syntax colors assigned by hand (Omarchy selects the bamboo Neovim colorscheme and ships no tmTheme).

name = "Osaka Jade"
variant = "dark"
url = "https://github.com/Justikun/omarchy-osaka-jade-theme"
description = "A deep green dark theme with warm sand text, from the Omarchy collection."

[ansi]
black = "#23372b"
red = "#ff5345"
green = "#549e6a"
yellow = "#459451"
blue = "#509475"
magenta = "#d2689c"
cyan = "#2dd5b7"
white = "#f6f5dd"
bright-black = "#53685b"
bright-red = "#db9f9c"
bright-green = "#63b07a"
bright-yellow = "#e5c736"
bright-blue = "#acd4cf"
bright-magenta = "#75bbb3"
bright-cyan = "#8cd3cb"
bright-white = "#9eebb3"

[ui]
background = "#111c18"
foreground = "#c1c497"
foreground-light = "#d8dabe"
accent = "#509475"
selection-bg = "#32473b"
selection-fg = "#c1c497"
line-highlight = "#23372b"
cursor = "#c1c497"
border = "#384134"
gutter-bg = "#111c18"
gutter-fg = "#53685b"
chrome-bg = "#1c2620"

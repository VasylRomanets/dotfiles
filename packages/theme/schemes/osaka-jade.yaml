# Palette from the Omarchy theme's colors.toml; syntax colors assigned by hand (Omarchy selects the bamboo Neovim colorscheme and ships no tmTheme).

scheme:
  system: "tinted8"
  supports:
    styling-spec: "0.2.0"
  author: "Vasyl Romanets"
  theme-author: "https://github.com/omacom/omarchy"
  name: "Osaka Jade"
  slug: "osaka-jade"
variant: "dark"
palette:
  black: "#111c18"
  white: "#c1c497"
  red: "#ff5345"
  red-bright: "#db9f9c"
  green: "#549e6a"
  green-bright: "#63b07a"
  yellow: "#459451"
  yellow-bright: "#e5c736"
  blue: "#509475"
  blue-bright: "#acd4cf"
  magenta: "#d2689c"
  magenta-bright: "#75bbb3"
  cyan: "#2dd5b7"
  cyan-bright: "#8cd3cb"
  gray: "#53685b"
syntax:
  comment: "#53685b"
  invalid: "#ff5345"
  string: "#63b07a"
  string.regexp: "#2dd5b7"
  constant: "#e5c736"
  entity: "#c1c497"
  entity.name.class: "#8cd3cb"
  entity.name.function: "#2dd5b7"
  entity.name.tag: "#ff5345"
  entity.name.type: "#8cd3cb"
  entity.name.namespace: "#8cd3cb"
  entity.name.section: "#2dd5b7"
  entity.other.attribute-name: "#549e6a"
  entity.other.inherited-class: "#8cd3cb"
  keyword: "#d2689c"
  keyword.operator: "#d6d5bc"
  storage: "#d2689c"
  storage.type: "#8cd3cb"
  support: "#2dd5b7"
  support.class: "#8cd3cb"
  support.type: "#8cd3cb"
  variable: "#c1c497"
  variable.parameter: "#81b8a8"
  variable.language: "#2dd5b7"
  punctuation: "#c1c497"
  markup: "#c1c497"
  markup.bold: "#d2689c"
  markup.italic: "#d2689c"
  markup.quote: "#53685b"
  markup.heading: "#2dd5b7"
  markup.link: "#8cd3cb"
  markup.inserted: "#549e6a"
  markup.changed: "#e5c736"
  markup.deleted: "#ff5345"
  source: "#c1c497"
  text: "#c1c497"
  meta: "#c1c497"
  meta.preprocessor: "#d2689c"
ui:
  accent:
    normal: "#509475"
  selection:
    background: "#32473b"
  highlight:
    line:
      background: "#23372b"
  cursor:
    normal:
      background: "#c1c497"
  border:
    normal: "#384134"
  gutter:
    foreground: "#53685b"
  chrome:
    background:
      normal: "#1c2620"
      dark: "#0c1411"
    foreground:
      dark: "#83896b"

# Oxford by HANCORE-linux, MIT. The terminal colors are the Ghostty file of its Omarchy theme, the syntax colors those of its Omarchy VS Code colors.

name = "Oxford"
variant = "dark"
url = "https://github.com/HANCORE-linux/omarchy-oxford-theme"
description = "A warm, muted scheme inspired by the 80s college aesthetic: dim library corners and aged pages."

[ansi]
black = "#292b31"
red = "#dd5544"
green = "#76856a"
yellow = "#f3e9bd"
blue = "#bda07f"
magenta = "#b7a593"
cyan = "#9b907f"
white = "#ffffff"
bright-black = "#646466"
bright-red = "#f28b7c"
bright-green = "#a8b49d"
bright-yellow = "#fff4d4"
bright-blue = "#d8c3a5"
bright-magenta = "#b0a89d"
bright-cyan = "#c7c0b5"
bright-white = "#d6d1c9"

[ui]

# Popping and Locking by Hedinn Eiriksson (hedinne), MIT. The terminal colors and the syntax colors are those of his VS Code theme, which the iTerm2-Color-Schemes version copies, apart from the cursor and selection.

name = "Popping and Locking"
variant = "dark"
url = "https://github.com/hedinne/popping-and-locking-vscode"
description = "Vivid, balanced Gruvbox-flavored colors on deep navy, made for web languages."


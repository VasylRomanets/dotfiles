# Retro 82 by OldJobobo (github.com/OldJobobo/omarchy-retro-82-theme), the theme bundled with Omarchy. Terminal colors from its Ghostty config; syntax colors, selection and line highlight from the author's VS Code theme.

name = "Retro 82"
variant = "dark"
url = "https://github.com/OldJobobo/omarchy-retro-82-theme"

[ansi]
black = "#00172e"
red = "#f85525"
green = "#028391"
yellow = "#e97b3c"
blue = "#faa968"
magenta = "#3f8f8a"
cyan = "#8cbfb8"
white = "#f6dcac"
bright-black = "#57898a"
bright-red = "#f97751"
bright-green = "#35a2a7"
bright-yellow = "#ed9563"
bright-blue = "#fbb986"
bright-magenta = "#65a5a1"
bright-cyan = "#a3ccc6"
bright-white = "#f6dcac"

[ui]

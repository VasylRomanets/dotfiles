# Palette from the Omarchy theme's colors.toml; syntax colors follow Monokai Pro conventions (Omarchy ships no tmTheme).

scheme:
  system: "tinted8"
  supports:
    styling-spec: "0.2.0"
  author: "Vasyl Romanets"
  theme-author: "https://github.com/omacom/omarchy"
  name: "Ristretto"
  slug: "ristretto"
variant: "dark"
palette:
  black: "#2c2525"
  white: "#e6d9db"
  red: "#fd6883"
  red-bright: "#ff8297"
  green: "#adda78"
  green-bright: "#c8e292"
  yellow: "#f9cc6c"
  yellow-bright: "#fcd675"
  blue: "#f38d70"
  blue-bright: "#f8a788"
  magenta: "#a8a9eb"
  magenta-bright: "#bebffd"
  cyan: "#85dacc"
  cyan-bright: "#9bf1e1"
  gray: "#72696a"
syntax:
  comment: "#72696a"
  invalid: "#ff8297"
  string: "#f9cc6c"
  string.regexp: "#85dacc"
  constant: "#a8a9eb"
  entity: "#e6d9db"
  entity.name.class: "#85dacc"
  entity.name.function: "#adda78"
  entity.name.tag: "#fd6883"
  entity.name.type: "#85dacc"
  entity.name.namespace: "#85dacc"
  entity.name.section: "#adda78"
  entity.other.attribute-name: "#adda78"
  entity.other.inherited-class: "#85dacc"
  keyword: "#fd6883"
  storage: "#fd6883"
  storage.type: "#85dacc"
  support: "#85dacc"
  support.function: "#adda78"
  variable: "#e6d9db"
  variable.parameter: "#fb9a77"
  variable.language: "#85dacc"
  punctuation: "#e6d9db"
  markup: "#e6d9db"
  markup.bold: "#fd6883"
  markup.italic: "#fd6883"
  markup.quote: "#72696a"
  markup.heading: "#adda78"
  markup.link: "#85dacc"
  markup.inserted: "#adda78"
  markup.changed: "#f9cc6c"
  markup.deleted: "#fd6883"
  source: "#e6d9db"
  text: "#e6d9db"
  meta: "#e6d9db"
  meta.preprocessor: "#fd6883"
ui:
  accent:
    normal: "#f38d70"
  selection:
    background: "#403e41"
  highlight:
    line:
      background: "#3d2f2a"
  cursor:
    normal:
      background: "#e6d9db"
  border:
    normal: "#554d4d"
  gutter:
    foreground: "#72696a"
  chrome:
    background:
      normal: "#373030"
      dark: "#1f1a1a"
    foreground:
      dark: "#a59a9b"

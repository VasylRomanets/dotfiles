# Rouge Theme (version 2) for VS Code by Josef Aidt (josefaidt), MIT. The terminal colors and the syntax colors are the theme's own; the iTerm2-Color-Schemes adaptation differs in bright green.

name = "Rouge 2"
variant = "dark"
url = "https://github.com/josefaidt/rouge-theme"
description = "A flushed, cozy dark theme: dusty rose, sage and sand on deep indigo."

[ansi]
black = "#5d5d6b"
red = "#c6797e"
green = "#969e92"
yellow = "#dbcdab"
blue = "#6e94b9"
magenta = "#4c4e78"
cyan = "#8ab6c1"
white = "#e8e8ea"
bright-black = "#616274"
bright-red = "#c6797e"
bright-green = "#b6bbb3"
bright-yellow = "#e6dcc4"
bright-blue = "#98b3cd"
bright-magenta = "#8283a1"
bright-cyan = "#abcbd3"
bright-white = "#e8e8ea"

[ui]
background = "#17182b"
foreground = "#a2a3aa"
foreground-light = "#c2c3c7"
accent = "#c6797e"
selection-bg = "#2b3d47"

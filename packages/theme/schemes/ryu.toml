# Ryu by HANCORE-linux, MIT. The terminal colors are the colors.toml of its Omarchy theme, the syntax colors those of its Neovim palette, applied as aether.nvim does, with faint ones nudged until they read. The ANSI yellow is a dark grey-green, so warning uses the gold instead.

name = "Ryu"
variant = "dark"
url = "https://github.com/HANCORE-linux/omarchy-ryu-theme"
description = "Ink-wash black and aged parchment, inspired by dragons and Japanese Sumi-e painting."

[ansi]
black = "#050505"
red = "#da614e"
green = "#8b9388"
yellow = "#51605b"
blue = "#75897f"
magenta = "#c2a46d"
cyan = "#717c7c"
white = "#d6d0c5"
bright-black = "#404040"
bright-red = "#df6124"
bright-green = "#525e5a"
bright-yellow = "#8b9388"
bright-blue = "#75897f"
bright-magenta = "#c2a46d"
bright-cyan = "#52565e"
bright-white = "#fff9ed"

[ui]

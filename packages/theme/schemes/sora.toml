# Converted from sora.tmTheme and Ghostty theme sora.ghostty.

name = "Sora"
variant = "dark"
url = "https://github.com/Aejkatappaja/sora"
description = "A deep colorscheme: ethereal cyan, muted accents, near-black canvas."

[ansi]
black = "#0e1018"
red = "#c46c78"
green = "#90c8a0"
yellow = "#d4b878"
blue = "#80c8e0"
magenta = "#b0a0d8"
cyan = "#78b8b0"
white = "#c8d0e0"
bright-black = "#4a5468"
bright-red = "#d88898"
bright-green = "#a8d8b4"
bright-yellow = "#e0c888"
bright-blue = "#98d8f0"
bright-magenta = "#c4b4e8"
bright-cyan = "#90d0c8"
bright-white = "#dce4f0"

[ui]

# The Black Pharaoh by OldJobobo; the repo declares no license. The terminal colors are the Ghostty file of its Omarchy theme, the syntax colors those of its VS Code theme, with faint ones nudged until they read.

name = "The Black Pharaoh"
variant = "dark"
url = "https://github.com/OldJobobo/omarchy-the-black-pharaoh-theme"
description = "A quiet, low-contrast dark theme of blackened plum, aged parchment and small cyan-gold marks."


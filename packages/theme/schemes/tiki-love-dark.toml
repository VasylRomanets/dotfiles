# Tiki Love Dark by Steve Babigian (github.com/k00k/tiki-love-dark). Terminal colors from its Ghostty theme; syntax colors, selection and line highlight from its VS Code theme.

name = "Tiki Love Dark"
variant = "dark"
url = "https://github.com/k00k/tiki-love-dark"
description = "A warm, retro-tiki dark theme: carved-tiki browns, mai-tai-orange accents, bamboo-green strings."

[ansi]
black = "#1a1e14"
red = "#e85a4f"
green = "#6aaf5c"
yellow = "#f0a84c"
blue = "#8a9a6a"

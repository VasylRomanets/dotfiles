# Converted from tomorrow-night-bright.tmTheme and Ghostty theme Tomorrow Night Bright.

name = "Tomorrow Night Bright"
variant = "dark"
url = "https://github.com/chriskempson/tomorrow-theme"
description = "A clean color scheme family with one light and four night variants."

[ansi]
black = "#000000"
red = "#d54e53"
green = "#b9ca4a"
yellow = "#e7c547"
blue = "#7aa6da"
magenta = "#c397d8"
cyan = "#70c0b1"
white = "#ffffff"
bright-black = "#404040"
bright-red = "#d54e53"
bright-green = "#b9ca4a"
bright-yellow = "#e7c547"
bright-blue = "#7aa6da"
bright-magenta = "#c397d8"

# Converted from tomorrow-night.tmTheme and Ghostty theme Tomorrow Night.

name = "Tomorrow Night"
variant = "dark"
url = "https://github.com/chriskempson/tomorrow-theme"
description = "A clean color scheme family with one light and four night variants."

[ansi]
black = "#000000"
red = "#cc6666"
green = "#b5bd68"
yellow = "#f0c674"
blue = "#81a2be"
magenta = "#b294bb"
cyan = "#8abeb7"
white = "#ffffff"
bright-black = "#4c4c4c"
bright-red = "#cc6666"
bright-green = "#b5bd68"
bright-yellow = "#f0c674"
bright-blue = "#81a2be"
bright-magenta = "#b294bb"
bright-cyan = "#8abeb7"
bright-white = "#ffffff"

[ui]

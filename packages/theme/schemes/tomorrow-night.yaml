# Converted from tomorrow-night.tmTheme and Ghostty theme Tomorrow Night.

scheme:
  system: "tinted8"
  supports:
    styling-spec: "0.2.0"
  author: "Vasyl Romanets"
  theme-author: "https://github.com/chriskempson/tomorrow-theme"
  name: "Tomorrow Night"
  slug: "tomorrow-night"
variant: "dark"
palette:
  black: "#1d1f21"
  white: "#c5c8c6"
  red: "#cc6666"
  red-bright: "#cc6666"
  green: "#b5bd68"
  green-bright: "#b5bd68"
  yellow: "#f0c674"
  yellow-bright: "#f0c674"
  blue: "#81a2be"
  blue-bright: "#81a2be"
  magenta: "#b294bb"
  magenta-bright: "#b294bb"
  cyan: "#8abeb7"
  cyan-bright: "#8abeb7"
  gray: "#969896"
  orange: "#de935f"
syntax:
  comment: "#969896"
  invalid: "#ced2cf"
  string: "#b5bd68"
  string.regexp: "#cc6666"
  constant: "#c5c8c6"
  constant.numeric: "#de935f"
  constant.language: "#de935f"
  constant.character: "#de935f"
  constant.other: "#ced1cf"
  entity: "#c5c8c6"
  entity.name.class: "#f0c674"
  entity.name.function: "#81a2be"
  entity.name.tag: "#cc6666"
  entity.name.type.class: "#f0c674"
  entity.other.attribute-name: "#cc6666"
  entity.other.inherited-class: "#b5bd68"
  keyword: "#b294bb"
  keyword.operator: "#8abeb7"
  storage: "#b294bb"
  support: "#c5c8c6"
  support.function: "#81a2be"
  support.class: "#f0c674"
  support.type: "#f0c674"
  support.constant: "#de935f"
  variable: "#cc6666"
  variable.parameter: "#de935f"
  punctuation: "#c5c8c6"
  punctuation.definition.string: "#b5bd68"
  punctuation.definition.comment: "#969896"
  markup: "#c5c8c6"
  markup.heading: "#b5bd68"
  source: "#c5c8c6"
  text: "#c5c8c6"
  meta: "#c5c8c6"
  meta.tag: "#cc6666"
ui:
  accent:
    normal: "#8abeb7"
  selection:
    background: "#373b41"
  highlight:
    line:
      background: "#282a2e"
  cursor:
    normal:
      background: "#aeafad"
  border:
    normal: "#424445"
  gutter:
    foreground: "#969896"
  chrome:
    background:
      normal: "#27292b"
      dark: "#141617"
    foreground:
      dark: "#8a8d8c"

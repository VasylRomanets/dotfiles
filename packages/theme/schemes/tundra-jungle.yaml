  blue: "#acd5fc"
  blue-bright: "#acd5fc"
  magenta: "#b5b5ff"
  magenta-bright: "#b5b5ff"
  cyan: "#d7d7ff"
  cyan-bright: "#d7d7ff"
  gray: "#767676"
  orange: "#f5cfa9"
syntax:

# Warm Burnout by Felipe Lima, MIT. The terminal colors are the Ghostty file of its dark variant, the syntax colors those of its bat .tmTheme.

name = "Warm Burnout Dark"
variant = "dark"
url = "https://github.com/felipefdl/warm-burnout"
description = "A mostly warm palette of amber, terra cotta and sage on a brown-black page, with one cool steel-blue accent for types."

[ansi]
black = "#23211b"
red = "#f06b73"
green = "#70bf56"
yellow = "#fdb04c"
blue = "#4fbfff"
magenta = "#d0a1ff"
cyan = "#93e2c8"
white = "#c7c7c7"

bright-red = "#f07178"
bright-green = "#aad94c"
bright-yellow = "#ffb454"
bright-blue = "#59c2ff"
bright-magenta = "#d2a6ff"
bright-cyan = "#95e6cb"
bright-white = "#ffffff"


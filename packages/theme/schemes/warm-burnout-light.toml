# Warm Burnout by Felipe Lima, MIT. The terminal colors are the Ghostty file of its light variant, the syntax colors those of its bat .tmTheme.

name = "Warm Burnout Light"
variant = "light"
url = "https://github.com/felipefdl/warm-burnout"
description = "A mostly warm palette of amber, terra cotta and sage on a sepia cream page, with one cool steel-blue accent for types."


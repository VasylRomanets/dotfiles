# White Gold by HANCORE-linux, MIT. The terminal colors are the Ghostty file of its Omarchy theme, the syntax colors those of its VS Code theme. The theme's ANSI hues are shuffled (green is bronze, blue is dark green), so warning, success and diff-added use the green and bronze its Neovim config names for them.

name = "White Gold"
variant = "light"
url = "https://github.com/HANCORE-linux/omarchy-whitegold-theme"
description = "Clarity meets warmth: deep green, bronze and wine ink on a pale sand page."

[ansi]
black = "#dedbc8"
red = "#4b0304"
green = "#725c0a"
yellow = "#2e311a"
blue = "#005c32"
magenta = "#762b2f"
cyan = "#3b3b3b"
white = "#665e4a"
bright-black = "#9a9078"
bright-red = "#4b0304"
bright-green = "#725c0a"
bright-yellow = "#005c32"
bright-blue = "#2e311a"
bright-magenta = "#762b2f"
bright-cyan = "#3b3b3b"
bright-white = "#0c0c14"

[ui]
background = "#dedbc8"
foreground = "#0c0c14"
foreground-light = "#000000"
accent = "#005c32"
selection-bg = "#c4c1ac"
selection-fg = "#0c0c14"
line-highlight = "#e9e6d3"
cursor = "#91760d"
border = "#b0ada0"
gutter-bg = "#dedbc8"
gutter-fg = "#645c4b"
chrome-bg = "#d1cfbd"
chrome-bg-dark = "#c9c6b6"
chrome-fg-dark = "#555453"
whitespace = "#645c4b"
error = "#4b0304"
warning = "#6c5319"
success = "#005c32"
diff-added = "#005c32"
diff-removed = "#4b0304"


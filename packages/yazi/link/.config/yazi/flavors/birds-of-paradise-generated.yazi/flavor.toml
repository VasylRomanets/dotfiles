# Birds Of Paradise

[mgr]
cwd = { fg = "#74a6ad" }
find_keyword = { fg = "#e99d2a", bold = true }
find_position = { fg = "#74a6ad", italic = true }
symlink_target = { fg = "#9b6c4a", italic = true }
marker_copied = { fg = "#6ba18a", bg = "#6ba18a" }
marker_cut = { fg = "#be2d26", bg = "#be2d26" }
marker_marked = { fg = "#ac80a6", bg = "#ac80a6" }
marker_selected = { fg = "#74a6ad", bg = "#74a6ad" }
count_copied = { fg = "#2a1f1d", bg = "#6ba18a" }
count_cut = { fg = "#2a1f1d", bg = "#be2d26" }
count_selected = { fg = "#2a1f1d", bg = "#74a6ad" }
border_style = { fg = "#52483f" }

[tabs]
active = { fg = "#e0dbb7", bg = "#352a26" }
inactive = { fg = "#9b6c4a", bg = "#1d1614" }

[mode]
normal_main = { fg = "#2a1f1d", bg = "#74a6ad", bold = true }
normal_alt = { fg = "#74a6ad", bg = "#352a26" }
select_main = { fg = "#2a1f1d", bg = "#ac80a6", bold = true }
select_alt = { fg = "#ac80a6", bg = "#352a26" }
unset_main = { fg = "#2a1f1d", bg = "#d19ecb", bold = true }
unset_alt = { fg = "#d19ecb", bg = "#352a26" }

[indicator]
parent = { bg = "#352a26" }
current = { bg = "#563c27" }
preview = { bg = "#352a26" }

[status]
overall = { fg = "#e0dbb7", bg = "#352a26" }
perm_sep = { fg = "#52483f" }
perm_type = { fg = "#93cfd7" }
perm_read = { fg = "#e99d2a" }
perm_write = { fg = "#d19ecb" }
perm_exec = { fg = "#6ba18a" }
progress_label = { fg = "#e0dbb7", bold = true }
progress_normal = { fg = "#74a6ad", bg = "#352a26" }
progress_error = { fg = "#2a1f1d", bg = "#be2d26" }

[which]
mask = { bg = "#1d1614" }
cand = { fg = "#74a6ad" }
rest = { fg = "#9b6c4a" }
desc = { fg = "#a09981" }
separator_style = { fg = "#52483f" }

[confirm]
border = { fg = "#74a6ad" }
title = { fg = "#74a6ad" }
body = { fg = "#e0dbb7" }
list = { fg = "#a09981" }
btn_yes = { fg = "#2a1f1d", bg = "#74a6ad", bold = true }
btn_no = { fg = "#a09981" }

[spot]
border = { fg = "#74a6ad" }
title = { fg = "#74a6ad" }
tbl_col = { fg = "#93cfd7" }
tbl_cell = { fg = "#2a1f1d", bg = "#74a6ad" }

[notify]
title_info = { fg = "#5a86ad" }
title_warn = { fg = "#e99d2a" }
title_error = { fg = "#be2d26" }

[pick]
border = { fg = "#74a6ad" }
active = { fg = "#74a6ad", bold = true }
inactive = { fg = "#a09981" }

[input]
border = { fg = "#74a6ad" }
title = { fg = "#74a6ad" }
value = { fg = "#e0dbb7" }
selected = { bg = "#563c27" }

[cmp]
border = { fg = "#74a6ad" }
active = { fg = "#2a1f1d", bg = "#74a6ad" }
inactive = { fg = "#a09981" }

[tasks]
border = { fg = "#74a6ad" }
title = { fg = "#74a6ad" }
hovered = { fg = "#74a6ad", bold = true }

[help]
on = { fg = "#74a6ad" }
run = { fg = "#a09981" }
desc = { fg = "#9b6c4a" }
hovered = { bg = "#563c27", bold = true }
footer = { fg = "#9b6c4a", bg = "#1d1614" }

[filetype]
rules = [
  { url = "*/", fg = "#74a6ad", bold = true },
  { mime = "image/*", fg = "#d0d150" },
  { mime = "video/*", fg = "#e99d2a" },
  { mime = "audio/*", fg = "#e99d2a" },
  { mime = "application/zip", fg = "#ac80a6" },
  { mime = "application/gzip", fg = "#ac80a6" },
  { mime = "application/x-tar", fg = "#ac80a6" },
  { mime = "application/x-bzip2", fg = "#ac80a6" },
  { mime = "application/x-7z-compressed", fg = "#ac80a6" },
  { mime = "application/x-rar", fg = "#ac80a6" },
  { url = "*.rs", fg = "#d0d150" },
  { url = "*.lua", fg = "#74a6ad" },
  { url = "*.ts", fg = "#74a6ad" },
  { url = "*.js", fg = "#e99d2a" },
  { url = "*.py", fg = "#6ba18a" },
  { url = "*.go", fg = "#93cfd7" },
  { url = "*.md", fg = "#a09981" },
  { url = "*.json", fg = "#e99d2a" },
  { url = "*.toml", fg = "#d0d150" },
  { url = "*.yaml", fg = "#d19ecb" },
  { url = "*.yml", fg = "#d19ecb" },
]



# Kanso Mist

[mgr]
cwd = { fg = "#8ea4a2" }
find_keyword = { fg = "#c4b28a", bold = true }
find_position = { fg = "#8ea4a2", italic = true }
symlink_target = { fg = "#5c6066", italic = true }
marker_copied = { fg = "#8a9a7b", bg = "#8a9a7b" }
marker_cut = { fg = "#c4746e", bg = "#c4746e" }
marker_marked = { fg = "#a292a3", bg = "#a292a3" }
marker_selected = { fg = "#8ea4a2", bg = "#8ea4a2" }
count_copied = { fg = "#23262d", bg = "#8a9a7b" }
count_cut = { fg = "#23262d", bg = "#c4746e" }
count_selected = { fg = "#23262d", bg = "#8ea4a2" }
border_style = { fg = "#474a4f" }

[tabs]
active = { fg = "#c5c9c7", bg = "#2d3036" }
inactive = { fg = "#5c6066", bg = "#181b1f" }

[mode]
normal_main = { fg = "#23262d", bg = "#8ea4a2", bold = true }
normal_alt = { fg = "#8ea4a2", bg = "#2d3036" }
select_main = { fg = "#23262d", bg = "#a292a3", bold = true }
select_alt = { fg = "#a292a3", bg = "#2d3036" }
unset_main = { fg = "#23262d", bg = "#938aa9", bold = true }
unset_alt = { fg = "#938aa9", bg = "#2d3036" }

[indicator]
parent = { bg = "#2d3036" }
current = { bg = "#43464e" }
preview = { bg = "#2d3036" }

[status]
overall = { fg = "#c5c9c7", bg = "#2d3036" }
perm_sep = { fg = "#474a4f" }
perm_type = { fg = "#7aa89f" }
perm_read = { fg = "#c4b28a" }
perm_write = { fg = "#938aa9" }
perm_exec = { fg = "#8a9a7b" }
progress_label = { fg = "#c5c9c7", bold = true }
progress_normal = { fg = "#8ea4a2", bg = "#2d3036" }
progress_error = { fg = "#23262d", bg = "#c4746e" }

[which]
mask = { bg = "#181b1f" }
cand = { fg = "#8ea4a2" }
rest = { fg = "#5c6066" }
desc = { fg = "#8c9091" }
separator_style = { fg = "#474a4f" }

[confirm]
border = { fg = "#8ea4a2" }
title = { fg = "#8ea4a2" }
body = { fg = "#c5c9c7" }
list = { fg = "#8c9091" }
btn_yes = { fg = "#23262d", bg = "#8ea4a2", bold = true }
btn_no = { fg = "#8c9091" }

[spot]
border = { fg = "#8ea4a2" }
title = { fg = "#8ea4a2" }
tbl_col = { fg = "#7aa89f" }
tbl_cell = { fg = "#23262d", bg = "#8ea4a2" }

[notify]
title_info = { fg = "#8ba4b0" }
title_warn = { fg = "#c4b28a" }
title_error = { fg = "#c4746e" }

[pick]
border = { fg = "#8ea4a2" }
active = { fg = "#8ea4a2", bold = true }
inactive = { fg = "#8c9091" }

[input]
border = { fg = "#8ea4a2" }
title = { fg = "#8ea4a2" }
value = { fg = "#c5c9c7" }
selected = { bg = "#43464e" }

[cmp]
border = { fg = "#8ea4a2" }
active = { fg = "#23262d", bg = "#8ea4a2" }
inactive = { fg = "#8c9091" }

[tasks]
border = { fg = "#8ea4a2" }
title = { fg = "#8ea4a2" }
hovered = { fg = "#8ea4a2", bold = true }

[help]
on = { fg = "#8ea4a2" }
run = { fg = "#8c9091" }
desc = { fg = "#5c6066" }
hovered = { bg = "#43464e", bold = true }
footer = { fg = "#5c6066", bg = "#181b1f" }

[filetype]
rules = [
  { url = "*/", fg = "#8ea4a2", bold = true },
  { mime = "image/*", fg = "#e6c384" },
  { mime = "video/*", fg = "#c4b28a" },
  { mime = "audio/*", fg = "#c4b28a" },
  { mime = "application/zip", fg = "#a292a3" },
  { mime = "application/gzip", fg = "#a292a3" },
  { mime = "application/x-tar", fg = "#a292a3" },
  { mime = "application/x-bzip2", fg = "#a292a3" },
  { mime = "application/x-7z-compressed", fg = "#a292a3" },
  { mime = "application/x-rar", fg = "#a292a3" },
  { url = "*.rs", fg = "#e6c384" },
  { url = "*.lua", fg = "#8ea4a2" },
  { url = "*.ts", fg = "#8ea4a2" },
  { url = "*.js", fg = "#c4b28a" },
  { url = "*.py", fg = "#8a9a7b" },
  { url = "*.go", fg = "#7aa89f" },
  { url = "*.md", fg = "#8c9091" },
  { url = "*.json", fg = "#c4b28a" },
  { url = "*.toml", fg = "#e6c384" },
  { url = "*.yaml", fg = "#938aa9" },
  { url = "*.yml", fg = "#938aa9" },
]



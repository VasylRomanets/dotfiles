# Kanso Pearl

[mgr]
cwd = { fg = "#597b75" }
find_keyword = { fg = "#77713f", bold = true }
find_position = { fg = "#597b75", italic = true }
symlink_target = { fg = "#5c6066", italic = true }
marker_copied = { fg = "#6f894e", bg = "#6f894e" }
marker_cut = { fg = "#c84053", bg = "#c84053" }
marker_marked = { fg = "#b35b79", bg = "#b35b79" }
marker_selected = { fg = "#597b75", bg = "#597b75" }
count_copied = { fg = "#f2f1ef", bg = "#6f894e" }
count_cut = { fg = "#f2f1ef", bg = "#c84053" }
count_selected = { fg = "#f2f1ef", bg = "#597b75" }
border_style = { fg = "#c4c4c4" }

[tabs]

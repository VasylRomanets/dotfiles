[mode]
normal_main = { fg = "#f2f1ef", bg = "#597b75", bold = true }
normal_alt = { fg = "#597b75", bg = "#e6e5e3" }
select_main = { fg = "#f2f1ef", bg = "#b35b79", bold = true }
select_alt = { fg = "#b35b79", bg = "#e6e5e3" }
unset_main = { fg = "#f2f1ef", bg = "#624c83", bold = true }
unset_alt = { fg = "#624c83", bg = "#e6e5e3" }

[indicator]
parent = { bg = "#e6e5e3" }
current = { bg = "#e2e1df" }
preview = { bg = "#e6e5e3" }

[status]
overall = { fg = "#22262d", bg = "#e6e5e3" }
perm_sep = { fg = "#c4c4c4" }
perm_type = { fg = "#5e857a" }
perm_read = { fg = "#77713f" }
perm_write = { fg = "#624c83" }
perm_exec = { fg = "#6f894e" }
progress_label = { fg = "#22262d", bold = true }
progress_normal = { fg = "#597b75", bg = "#e6e5e3" }
progress_error = { fg = "#f2f1ef", bg = "#c84053" }

[which]
mask = { bg = "#dddddc" }
cand = { fg = "#597b75" }
rest = { fg = "#5c6066" }
desc = { fg = "#6b6d71" }
separator_style = { fg = "#c4c4c4" }

[confirm]
border = { fg = "#597b75" }
title = { fg = "#597b75" }
body = { fg = "#22262d" }
list = { fg = "#6b6d71" }
btn_yes = { fg = "#f2f1ef", bg = "#597b75", bold = true }
btn_no = { fg = "#6b6d71" }

[spot]
border = { fg = "#597b75" }
title = { fg = "#597b75" }
tbl_col = { fg = "#5e857a" }
tbl_cell = { fg = "#f2f1ef", bg = "#597b75" }

[notify]
title_info = { fg = "#4d699b" }
title_warn = { fg = "#77713f" }
title_error = { fg = "#c84053" }

[pick]
border = { fg = "#597b75" }
active = { fg = "#597b75", bold = true }
inactive = { fg = "#6b6d71" }

[input]
border = { fg = "#597b75" }
title = { fg = "#597b75" }
value = { fg = "#22262d" }
selected = { bg = "#e2e1df" }

[cmp]
border = { fg = "#597b75" }
active = { fg = "#f2f1ef", bg = "#597b75" }
inactive = { fg = "#6b6d71" }

[tasks]
border = { fg = "#597b75" }
title = { fg = "#597b75" }
hovered = { fg = "#597b75", bold = true }

[help]
on = { fg = "#597b75" }
run = { fg = "#6b6d71" }
desc = { fg = "#5c6066" }
hovered = { bg = "#e2e1df", bold = true }
footer = { fg = "#5c6066", bg = "#dddddc" }

[filetype]
rules = [
  { url = "*/", fg = "#597b75", bold = true },
  { mime = "image/*", fg = "#836f4a" },
  { mime = "video/*", fg = "#77713f" },
  { mime = "audio/*", fg = "#77713f" },
  { mime = "application/zip", fg = "#b35b79" },
  { mime = "application/gzip", fg = "#b35b79" },
  { mime = "application/x-tar", fg = "#b35b79" },
  { mime = "application/x-bzip2", fg = "#b35b79" },
  { mime = "application/x-7z-compressed", fg = "#b35b79" },
  { mime = "application/x-rar", fg = "#b35b79" },
  { url = "*.rs", fg = "#836f4a" },
  { url = "*.lua", fg = "#597b75" },
  { url = "*.ts", fg = "#597b75" },
  { url = "*.js", fg = "#77713f" },
  { url = "*.py", fg = "#6f894e" },
  { url = "*.go", fg = "#5e857a" },
  { url = "*.md", fg = "#6b6d71" },
  { url = "*.json", fg = "#77713f" },
  { url = "*.toml", fg = "#836f4a" },
  { url = "*.yaml", fg = "#624c83" },
  { url = "*.yml", fg = "#624c83" },
]



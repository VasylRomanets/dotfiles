# No Clown Fiesta

[mgr]
cwd = { fg = "#88afa2" }
find_keyword = { fg = "#f4bf75", bold = true }
find_position = { fg = "#88afa2", italic = true }
symlink_target = { fg = "#727272", italic = true }
marker_copied = { fg = "#90a959", bg = "#90a959" }
marker_cut = { fg = "#b46958", bg = "#b46958" }
marker_marked = { fg = "#aa759f", bg = "#aa759f" }
marker_selected = { fg = "#88afa2", bg = "#88afa2" }
count_copied = { fg = "#101010", bg = "#90a959" }
count_cut = { fg = "#101010", bg = "#b46958" }
count_selected = { fg = "#101010", bg = "#88afa2" }
border_style = { fg = "#3e3e3f" }

[tabs]
active = { fg = "#e0e1e4", bg = "#1c1d1d" }
inactive = { fg = "#727272", bg = "#0b0b0b" }

[mode]
normal_main = { fg = "#101010", bg = "#88afa2", bold = true }
normal_alt = { fg = "#88afa2", bg = "#1c1d1d" }
select_main = { fg = "#101010", bg = "#aa759f", bold = true }
select_alt = { fg = "#aa759f", bg = "#1c1d1d" }
unset_main = { fg = "#101010", bg = "#aa759f", bold = true }
unset_alt = { fg = "#aa759f", bg = "#1c1d1d" }

[indicator]
parent = { bg = "#1c1d1d" }
current = { bg = "#696d79" }
preview = { bg = "#1c1d1d" }

[status]
overall = { fg = "#e0e1e4", bg = "#1c1d1d" }
perm_sep = { fg = "#3e3e3f" }
perm_type = { fg = "#88afa2" }
perm_read = { fg = "#f4bf75" }
perm_write = { fg = "#aa759f" }
perm_exec = { fg = "#90a959" }
progress_label = { fg = "#e0e1e4", bold = true }
progress_normal = { fg = "#88afa2", bg = "#1c1d1d" }
progress_error = { fg = "#101010", bg = "#b46958" }

[which]
mask = { bg = "#0b0b0b" }
cand = { fg = "#88afa2" }
rest = { fg = "#727272" }
desc = { fg = "#97989a" }
separator_style = { fg = "#3e3e3f" }

[confirm]
border = { fg = "#88afa2" }
title = { fg = "#88afa2" }
body = { fg = "#e0e1e4" }
list = { fg = "#97989a" }
btn_yes = { fg = "#101010", bg = "#88afa2", bold = true }
btn_no = { fg = "#97989a" }

[spot]
border = { fg = "#88afa2" }
title = { fg = "#88afa2" }
tbl_col = { fg = "#88afa2" }
tbl_cell = { fg = "#101010", bg = "#88afa2" }

[notify]
title_info = { fg = "#bad7ff" }
title_warn = { fg = "#f4bf75" }
title_error = { fg = "#b46958" }

[pick]
border = { fg = "#88afa2" }
active = { fg = "#88afa2", bold = true }
inactive = { fg = "#97989a" }

[input]
border = { fg = "#88afa2" }
title = { fg = "#88afa2" }
value = { fg = "#e0e1e4" }
selected = { bg = "#696d79" }

[cmp]
border = { fg = "#88afa2" }
active = { fg = "#101010", bg = "#88afa2" }
inactive = { fg = "#97989a" }

[tasks]
border = { fg = "#88afa2" }
title = { fg = "#88afa2" }
hovered = { fg = "#88afa2", bold = true }

[help]
on = { fg = "#88afa2" }
run = { fg = "#97989a" }
desc = { fg = "#727272" }
hovered = { bg = "#696d79", bold = true }
footer = { fg = "#727272", bg = "#0b0b0b" }

[filetype]
rules = [
  { url = "*/", fg = "#88afa2", bold = true },
  { mime = "image/*", fg = "#f4bf75" },
  { mime = "video/*", fg = "#f4bf75" },
  { mime = "audio/*", fg = "#f4bf75" },
  { mime = "application/zip", fg = "#aa759f" },
  { mime = "application/gzip", fg = "#aa759f" },
  { mime = "application/x-tar", fg = "#aa759f" },
  { mime = "application/x-bzip2", fg = "#aa759f" },
  { mime = "application/x-7z-compressed", fg = "#aa759f" },
  { mime = "application/x-rar", fg = "#aa759f" },
  { url = "*.rs", fg = "#f4bf75" },
  { url = "*.lua", fg = "#88afa2" },
  { url = "*.ts", fg = "#88afa2" },
  { url = "*.js", fg = "#f4bf75" },
  { url = "*.py", fg = "#90a959" },
  { url = "*.go", fg = "#88afa2" },
  { url = "*.md", fg = "#97989a" },
  { url = "*.json", fg = "#f4bf75" },
  { url = "*.toml", fg = "#f4bf75" },
  { url = "*.yaml", fg = "#aa759f" },
  { url = "*.yml", fg = "#aa759f" },
]



# No Clown Fiesta Light

[mgr]
cwd = { fg = "#3e5f66" }
find_keyword = { fg = "#b89058", bold = true }
find_position = { fg = "#3e5f66", italic = true }
symlink_target = { fg = "#2b2b2b", italic = true }
marker_copied = { fg = "#677940", bg = "#677940" }
marker_cut = { fg = "#874e42", bg = "#874e42" }
marker_marked = { fg = "#aa759f", bg = "#aa759f" }
marker_selected = { fg = "#3e5f66", bg = "#3e5f66" }
count_copied = { fg = "#e1e1e1", bg = "#677940" }
count_cut = { fg = "#e1e1e1", bg = "#874e42" }
count_selected = { fg = "#e1e1e1", bg = "#3e5f66" }
border_style = { fg = "#b4b4b4" }

[tabs]
active = { fg = "#151515", bg = "#d5d5d5" }
inactive = { fg = "#2b2b2b", bg = "#cdcdcd" }

[mode]
normal_main = { fg = "#e1e1e1", bg = "#3e5f66", bold = true }
normal_alt = { fg = "#3e5f66", bg = "#d5d5d5" }
select_main = { fg = "#e1e1e1", bg = "#aa759f", bold = true }
select_alt = { fg = "#aa759f", bg = "#d5d5d5" }
unset_main = { fg = "#e1e1e1", bg = "#aa759f", bold = true }
unset_alt = { fg = "#aa759f", bg = "#d5d5d5" }

[indicator]
parent = { bg = "#d5d5d5" }
current = { bg = "#c6d5de" }
preview = { bg = "#d5d5d5" }

[status]
overall = { fg = "#151515", bg = "#d5d5d5" }
perm_sep = { fg = "#b4b4b4" }
perm_type = { fg = "#99ab93" }
perm_read = { fg = "#b89058" }
perm_write = { fg = "#aa759f" }
perm_exec = { fg = "#677940" }
progress_label = { fg = "#151515", bold = true }
progress_normal = { fg = "#3e5f66", bg = "#d5d5d5" }
progress_error = { fg = "#e1e1e1", bg = "#874e42" }

[which]
mask = { bg = "#cdcdcd" }
cand = { fg = "#3e5f66" }
rest = { fg = "#2b2b2b" }
desc = { fg = "#5c5c5c" }
separator_style = { fg = "#b4b4b4" }

[confirm]
border = { fg = "#3e5f66" }
title = { fg = "#3e5f66" }
body = { fg = "#151515" }
list = { fg = "#5c5c5c" }
btn_yes = { fg = "#e1e1e1", bg = "#3e5f66", bold = true }
btn_no = { fg = "#5c5c5c" }

[spot]
border = { fg = "#3e5f66" }
title = { fg = "#3e5f66" }
tbl_col = { fg = "#99ab93" }
tbl_cell = { fg = "#e1e1e1", bg = "#3e5f66" }

[notify]
title_info = { fg = "#8ba1bf" }
title_warn = { fg = "#b89058" }
title_error = { fg = "#874e42" }

[pick]
border = { fg = "#3e5f66" }
active = { fg = "#3e5f66", bold = true }
inactive = { fg = "#5c5c5c" }

[input]
border = { fg = "#3e5f66" }
title = { fg = "#3e5f66" }
value = { fg = "#151515" }
selected = { bg = "#c6d5de" }

[cmp]
border = { fg = "#3e5f66" }
active = { fg = "#e1e1e1", bg = "#3e5f66" }
inactive = { fg = "#5c5c5c" }

[tasks]
border = { fg = "#3e5f66" }
title = { fg = "#3e5f66" }
hovered = { fg = "#3e5f66", bold = true }

[help]
on = { fg = "#3e5f66" }
run = { fg = "#5c5c5c" }
desc = { fg = "#2b2b2b" }
hovered = { bg = "#c6d5de", bold = true }
footer = { fg = "#2b2b2b", bg = "#cdcdcd" }

[filetype]
rules = [
  { url = "*/", fg = "#3e5f66", bold = true },
  { mime = "image/*", fg = "#b89058" },
  { mime = "video/*", fg = "#b89058" },
  { mime = "audio/*", fg = "#b89058" },
  { mime = "application/zip", fg = "#aa759f" },
  { mime = "application/gzip", fg = "#aa759f" },
  { mime = "application/x-tar", fg = "#aa759f" },
  { mime = "application/x-bzip2", fg = "#aa759f" },
  { mime = "application/x-7z-compressed", fg = "#aa759f" },
  { mime = "application/x-rar", fg = "#aa759f" },
  { url = "*.rs", fg = "#b89058" },
  { url = "*.lua", fg = "#3e5f66" },
  { url = "*.ts", fg = "#3e5f66" },
  { url = "*.js", fg = "#b89058" },
  { url = "*.py", fg = "#677940" },
  { url = "*.go", fg = "#99ab93" },
  { url = "*.md", fg = "#5c5c5c" },
  { url = "*.json", fg = "#b89058" },
  { url = "*.toml", fg = "#b89058" },
  { url = "*.yaml", fg = "#aa759f" },
  { url = "*.yml", fg = "#aa759f" },
]



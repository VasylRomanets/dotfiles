select_main = { fg = "#322a2d", bg = "#df769b", bold = true }
select_alt = { fg = "#df769b", bg = "#3b3336" }
unset_main = { fg = "#322a2d", bg = "#e798b3", bold = true }
unset_alt = { fg = "#e798b3", bg = "#3b3336" }

[indicator]

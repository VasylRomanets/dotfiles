title = { fg = "#49d6e9" }
body = { fg = "#cbbec2" }
list = { fg = "#958a8e" }
btn_yes = { fg = "#322a2d", bg = "#49d6e9", bold = true }
btn_no = { fg = "#958a8e" }

[spot]
border = { fg = "#49d6e9" }
title = { fg = "#49d6e9" }
tbl_col = { fg = "#60dbeb" }
tbl_cell = { fg = "#322a2d", bg = "#49d6e9" }

[notify]
title_info = { fg = "#49ace9" }
title_warn = { fg = "#e4b781" }
title_error = { fg = "#e66533" }

[pick]

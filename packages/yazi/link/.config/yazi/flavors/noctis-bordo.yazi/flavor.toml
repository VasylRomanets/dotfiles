find_keyword = { fg = "#e4b781", bold = true }
find_position = { fg = "#49d6e9", italic = true }
symlink_target = { fg = "#8b747c", italic = true }
marker_copied = { fg = "#49e9a6", bg = "#49e9a6" }
marker_cut = { fg = "#e66533", bg = "#e66533" }
marker_marked = { fg = "#df769b", bg = "#df769b" }
marker_selected = { fg = "#49d6e9", bg = "#49d6e9" }
count_copied = { fg = "#322a2d", bg = "#49e9a6" }
count_cut = { fg = "#322a2d", bg = "#e66533" }
count_selected = { fg = "#322a2d", bg = "#49d6e9" }
border_style = { fg = "#544b4e" }

[tabs]

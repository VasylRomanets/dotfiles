inactive = { fg = "#958a8e" }

[input]
border = { fg = "#49d6e9" }
title = { fg = "#49d6e9" }
value = { fg = "#cbbec2" }
selected = { bg = "#4a3339" }

[cmp]
border = { fg = "#49d6e9" }
active = { fg = "#322a2d", bg = "#49d6e9" }
inactive = { fg = "#958a8e" }

[tasks]
border = { fg = "#49d6e9" }
title = { fg = "#49d6e9" }
hovered = { fg = "#49d6e9", bold = true }

[help]
on = { fg = "#49d6e9" }
run = { fg = "#958a8e" }
desc = { fg = "#8b747c" }
hovered = { bg = "#4a3339", bold = true }
footer = { fg = "#8b747c", bg = "#231d1f" }

[filetype]
rules = [
  { url = "*/", fg = "#49d6e9", bold = true },
  { mime = "image/*", fg = "#e69533" },
  { mime = "video/*", fg = "#e4b781" },
  { mime = "audio/*", fg = "#e4b781" },
  { mime = "application/zip", fg = "#df769b" },
  { mime = "application/gzip", fg = "#df769b" },
  { mime = "application/x-tar", fg = "#df769b" },
  { mime = "application/x-bzip2", fg = "#df769b" },
  { mime = "application/x-7z-compressed", fg = "#df769b" },
  { mime = "application/x-rar", fg = "#df769b" },
  { url = "*.rs", fg = "#e69533" },
  { url = "*.lua", fg = "#49d6e9" },
  { url = "*.ts", fg = "#49d6e9" },
  { url = "*.js", fg = "#e4b781" },
  { url = "*.py", fg = "#49e9a6" },
  { url = "*.go", fg = "#60dbeb" },
  { url = "*.md", fg = "#958a8e" },
  { url = "*.json", fg = "#e4b781" },
  { url = "*.toml", fg = "#e69533" },
  { url = "*.yaml", fg = "#e798b3" },
  { url = "*.yml", fg = "#e798b3" },
]



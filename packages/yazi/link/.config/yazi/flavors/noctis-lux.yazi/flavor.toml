# Noctis Lux

[mgr]
cwd = { fg = "#00bdd6" }
find_keyword = { fg = "#f49725", bold = true }
find_position = { fg = "#00bdd6", italic = true }
symlink_target = { fg = "#8ca6a6", italic = true }
marker_copied = { fg = "#00b368", bg = "#00b368" }
marker_cut = { fg = "#e34e1c", bg = "#e34e1c" }
marker_marked = { fg = "#ff5792", bg = "#ff5792" }
marker_selected = { fg = "#00bdd6", bg = "#00bdd6" }
count_copied = { fg = "#fef8ec", bg = "#00b368" }
count_cut = { fg = "#fef8ec", bg = "#e34e1c" }
count_selected = { fg = "#fef8ec", bg = "#00bdd6" }
border_style = { fg = "#c6d4cd" }

[tabs]

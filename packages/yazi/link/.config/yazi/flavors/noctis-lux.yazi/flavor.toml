inactive = { fg = "#8ca6a6", bg = "#e5e8de" }

[mode]
normal_main = { fg = "#fef8ec", bg = "#00bdd6", bold = true }
normal_alt = { fg = "#00bdd6", bg = "#efeee4" }
select_main = { fg = "#fef8ec", bg = "#ff5792", bold = true }
select_alt = { fg = "#ff5792", bg = "#efeee4" }
unset_main = { fg = "#fef8ec", bg = "#ff6b9f", bold = true }
unset_alt = { fg = "#ff6b9f", bg = "#efeee4" }

[indicator]
parent = { bg = "#efeee4" }
current = { bg = "#f4e2b8" }
preview = { bg = "#efeee4" }

[status]
overall = { fg = "#005661", bg = "#efeee4" }
perm_sep = { fg = "#c6d4cd" }
perm_type = { fg = "#00cbe6" }
perm_read = { fg = "#f49725" }
perm_write = { fg = "#ff6b9f" }
perm_exec = { fg = "#00b368" }
progress_label = { fg = "#005661", bold = true }
progress_normal = { fg = "#00bdd6", bg = "#efeee4" }
progress_error = { fg = "#fef8ec", bg = "#e34e1c" }

[which]
mask = { bg = "#e5e8de" }
cand = { fg = "#00bdd6" }
rest = { fg = "#8ca6a6" }
desc = { fg = "#598f92" }
separator_style = { fg = "#c6d4cd" }

[confirm]
border = { fg = "#00bdd6" }
title = { fg = "#00bdd6" }
body = { fg = "#005661" }
list = { fg = "#598f92" }
btn_yes = { fg = "#fef8ec", bg = "#00bdd6", bold = true }
btn_no = { fg = "#598f92" }

[spot]
border = { fg = "#00bdd6" }
title = { fg = "#00bdd6" }
tbl_col = { fg = "#00cbe6" }
tbl_cell = { fg = "#fef8ec", bg = "#00bdd6" }

[notify]
title_info = { fg = "#0094f0" }
title_warn = { fg = "#f49725" }
title_error = { fg = "#e34e1c" }

[pick]
border = { fg = "#00bdd6" }
active = { fg = "#00bdd6", bold = true }
inactive = { fg = "#598f92" }

[input]
border = { fg = "#00bdd6" }
title = { fg = "#00bdd6" }
value = { fg = "#005661" }
selected = { bg = "#f4e2b8" }

[cmp]
border = { fg = "#00bdd6" }
active = { fg = "#fef8ec", bg = "#00bdd6" }
inactive = { fg = "#598f92" }

[tasks]
border = { fg = "#00bdd6" }
title = { fg = "#00bdd6" }
hovered = { fg = "#00bdd6", bold = true }

[help]
on = { fg = "#00bdd6" }
run = { fg = "#598f92" }
desc = { fg = "#8ca6a6" }
hovered = { bg = "#f4e2b8", bold = true }
footer = { fg = "#8ca6a6", bg = "#e5e8de" }

[filetype]
rules = [
  { url = "*/", fg = "#00bdd6", bold = true },
  { mime = "image/*", fg = "#ff8c00" },
  { mime = "video/*", fg = "#f49725" },
  { mime = "audio/*", fg = "#f49725" },
  { mime = "application/zip", fg = "#ff5792" },
  { mime = "application/gzip", fg = "#ff5792" },
  { mime = "application/x-tar", fg = "#ff5792" },
  { mime = "application/x-bzip2", fg = "#ff5792" },
  { mime = "application/x-7z-compressed", fg = "#ff5792" },
  { mime = "application/x-rar", fg = "#ff5792" },
  { url = "*.rs", fg = "#ff8c00" },
  { url = "*.lua", fg = "#00bdd6" },
  { url = "*.ts", fg = "#00bdd6" },
  { url = "*.js", fg = "#f49725" },
  { url = "*.py", fg = "#00b368" },
  { url = "*.go", fg = "#00cbe6" },
  { url = "*.md", fg = "#598f92" },
  { url = "*.json", fg = "#f49725" },
  { url = "*.toml", fg = "#ff8c00" },
  { url = "*.yaml", fg = "#ff6b9f" },
  { url = "*.yml", fg = "#ff6b9f" },
]



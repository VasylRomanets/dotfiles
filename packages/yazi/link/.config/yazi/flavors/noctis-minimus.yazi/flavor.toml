# Noctis Minimus

[mgr]
cwd = { fg = "#72b7c0" }
find_keyword = { fg = "#c8a984", bold = true }
find_position = { fg = "#72b7c0", italic = true }
symlink_target = { fg = "#5e7887", italic = true }
marker_copied = { fg = "#72c09f", bg = "#72c09f" }
marker_cut = { fg = "#c08872", bg = "#c08872" }
marker_marked = { fg = "#c28097", bg = "#c28097" }
marker_selected = { fg = "#72b7c0", bg = "#72b7c0" }
count_copied = { fg = "#1b2932", bg = "#72c09f" }
count_cut = { fg = "#1b2932", bg = "#c08872" }
count_selected = { fg = "#1b2932", bg = "#72b7c0" }
border_style = { fg = "#404d55" }

[tabs]
active = { fg = "#c5cdd3", bg = "#25333c" }
inactive = { fg = "#5e7887", bg = "#131d23" }

[mode]
normal_main = { fg = "#1b2932", bg = "#72b7c0", bold = true }
normal_alt = { fg = "#72b7c0", bg = "#25333c" }
select_main = { fg = "#1b2932", bg = "#c28097", bold = true }
select_alt = { fg = "#c28097", bg = "#25333c" }
unset_main = { fg = "#1b2932", bg = "#c88da2", bold = true }
unset_alt = { fg = "#c88da2", bg = "#25333c" }

[indicator]
parent = { bg = "#25333c" }
current = { bg = "#263c4a" }
preview = { bg = "#25333c" }

[status]
overall = { fg = "#c5cdd3", bg = "#25333c" }
perm_sep = { fg = "#404d55" }
perm_type = { fg = "#84c0c8" }
perm_read = { fg = "#c8a984" }
perm_write = { fg = "#c88da2" }
perm_exec = { fg = "#72c09f" }
progress_label = { fg = "#c5cdd3", bold = true }
progress_normal = { fg = "#72b7c0", bg = "#25333c" }
progress_error = { fg = "#1b2932", bg = "#c08872" }

[which]
mask = { bg = "#131d23" }
cand = { fg = "#72b7c0" }
rest = { fg = "#5e7887" }
desc = { fg = "#8a949b" }
separator_style = { fg = "#404d55" }

[confirm]
border = { fg = "#72b7c0" }
title = { fg = "#72b7c0" }
body = { fg = "#c5cdd3" }
list = { fg = "#8a949b" }
btn_yes = { fg = "#1b2932", bg = "#72b7c0", bold = true }
btn_no = { fg = "#8a949b" }

[spot]
border = { fg = "#72b7c0" }
title = { fg = "#72b7c0" }
tbl_col = { fg = "#84c0c8" }
tbl_cell = { fg = "#1b2932", bg = "#72b7c0" }

[notify]
title_info = { fg = "#6196b8" }
title_warn = { fg = "#c8a984" }
title_error = { fg = "#c08872" }

[pick]
border = { fg = "#72b7c0" }
active = { fg = "#72b7c0", bold = true }
inactive = { fg = "#8a949b" }

[input]
border = { fg = "#72b7c0" }
title = { fg = "#72b7c0" }
value = { fg = "#c5cdd3" }
selected = { bg = "#263c4a" }

[cmp]
border = { fg = "#72b7c0" }
active = { fg = "#1b2932", bg = "#72b7c0" }
inactive = { fg = "#8a949b" }

[tasks]
border = { fg = "#72b7c0" }
title = { fg = "#72b7c0" }
hovered = { fg = "#72b7c0", bold = true }

[help]
on = { fg = "#72b7c0" }
run = { fg = "#8a949b" }
desc = { fg = "#5e7887" }
hovered = { bg = "#263c4a", bold = true }
footer = { fg = "#5e7887", bg = "#131d23" }

[filetype]
rules = [
  { url = "*/", fg = "#72b7c0", bold = true },
  { mime = "image/*", fg = "#d1aa7b" },
  { mime = "video/*", fg = "#c8a984" },
  { mime = "audio/*", fg = "#c8a984" },
  { mime = "application/zip", fg = "#c28097" },
  { mime = "application/gzip", fg = "#c28097" },
  { mime = "application/x-tar", fg = "#c28097" },
  { mime = "application/x-bzip2", fg = "#c28097" },
  { mime = "application/x-7z-compressed", fg = "#c28097" },
  { mime = "application/x-rar", fg = "#c28097" },
  { url = "*.rs", fg = "#d1aa7b" },
  { url = "*.lua", fg = "#72b7c0" },
  { url = "*.ts", fg = "#72b7c0" },
  { url = "*.js", fg = "#c8a984" },
  { url = "*.py", fg = "#72c09f" },
  { url = "*.go", fg = "#84c0c8" },
  { url = "*.md", fg = "#8a949b" },
  { url = "*.json", fg = "#c8a984" },
  { url = "*.toml", fg = "#d1aa7b" },
  { url = "*.yaml", fg = "#c88da2" },
  { url = "*.yml", fg = "#c88da2" },
]



# Nord Wave

[mgr]
cwd = { fg = "#88c0d0" }
find_keyword = { fg = "#ebcb8b", bold = true }
find_position = { fg = "#88c0d0", italic = true }
symlink_target = { fg = "#4c566a", italic = true }
marker_copied = { fg = "#a3be8c", bg = "#a3be8c" }
marker_cut = { fg = "#bf616a", bg = "#bf616a" }
marker_marked = { fg = "#b48ead", bg = "#b48ead" }
marker_selected = { fg = "#88c0d0", bg = "#88c0d0" }
count_copied = { fg = "#212121", bg = "#a3be8c" }
count_cut = { fg = "#212121", bg = "#bf616a" }
count_selected = { fg = "#212121", bg = "#88c0d0" }
border_style = { fg = "#494b4d" }

[tabs]
active = { fg = "#d8dee9", bg = "#2c2c2d" }
inactive = { fg = "#4c566a", bg = "#171717" }

[mode]
normal_main = { fg = "#212121", bg = "#88c0d0", bold = true }
normal_alt = { fg = "#88c0d0", bg = "#2c2c2d" }
select_main = { fg = "#212121", bg = "#b48ead", bold = true }
select_alt = { fg = "#b48ead", bg = "#2c2c2d" }
unset_main = { fg = "#212121", bg = "#b48ead", bold = true }
unset_alt = { fg = "#b48ead", bg = "#2c2c2d" }

[indicator]
parent = { bg = "#2c2c2d" }
current = { bg = "#373839" }
preview = { bg = "#2c2c2d" }

[status]
overall = { fg = "#d8dee9", bg = "#2c2c2d" }
perm_sep = { fg = "#494b4d" }
perm_type = { fg = "#8fbcbb" }
perm_read = { fg = "#ebcb8b" }
perm_write = { fg = "#b48ead" }
perm_exec = { fg = "#a3be8c" }
progress_label = { fg = "#d8dee9", bold = true }
progress_normal = { fg = "#88c0d0", bg = "#2c2c2d" }
progress_error = { fg = "#212121", bg = "#bf616a" }

[which]
mask = { bg = "#171717" }
cand = { fg = "#88c0d0" }
rest = { fg = "#4c566a" }
desc = { fg = "#989ca3" }
separator_style = { fg = "#494b4d" }

[confirm]
border = { fg = "#88c0d0" }
title = { fg = "#88c0d0" }
body = { fg = "#d8dee9" }
list = { fg = "#989ca3" }
btn_yes = { fg = "#212121", bg = "#88c0d0", bold = true }
btn_no = { fg = "#989ca3" }

[spot]
border = { fg = "#88c0d0" }
title = { fg = "#88c0d0" }
tbl_col = { fg = "#8fbcbb" }
tbl_cell = { fg = "#212121", bg = "#88c0d0" }

[notify]
title_info = { fg = "#81a1c1" }
title_warn = { fg = "#ebcb8b" }
title_error = { fg = "#bf616a" }

[pick]
border = { fg = "#88c0d0" }
active = { fg = "#88c0d0", bold = true }
inactive = { fg = "#989ca3" }

[input]
border = { fg = "#88c0d0" }
title = { fg = "#88c0d0" }
value = { fg = "#d8dee9" }
selected = { bg = "#373839" }

[cmp]
border = { fg = "#88c0d0" }
active = { fg = "#212121", bg = "#88c0d0" }
inactive = { fg = "#989ca3" }

[tasks]
border = { fg = "#88c0d0" }
title = { fg = "#88c0d0" }
hovered = { fg = "#88c0d0", bold = true }

[help]
on = { fg = "#88c0d0" }
run = { fg = "#989ca3" }
desc = { fg = "#4c566a" }
hovered = { bg = "#373839", bold = true }
footer = { fg = "#4c566a", bg = "#171717" }

[filetype]
rules = [
  { url = "*/", fg = "#88c0d0", bold = true },
  { mime = "image/*", fg = "#ebcb8b" },
  { mime = "video/*", fg = "#ebcb8b" },
  { mime = "audio/*", fg = "#ebcb8b" },
  { mime = "application/zip", fg = "#b48ead" },
  { mime = "application/gzip", fg = "#b48ead" },
  { mime = "application/x-tar", fg = "#b48ead" },
  { mime = "application/x-bzip2", fg = "#b48ead" },
  { mime = "application/x-7z-compressed", fg = "#b48ead" },
  { mime = "application/x-rar", fg = "#b48ead" },
  { url = "*.rs", fg = "#ebcb8b" },
  { url = "*.lua", fg = "#88c0d0" },
  { url = "*.ts", fg = "#88c0d0" },
  { url = "*.js", fg = "#ebcb8b" },
  { url = "*.py", fg = "#a3be8c" },
  { url = "*.go", fg = "#8fbcbb" },
  { url = "*.md", fg = "#989ca3" },
  { url = "*.json", fg = "#ebcb8b" },
  { url = "*.toml", fg = "#ebcb8b" },
  { url = "*.yaml", fg = "#b48ead" },
  { url = "*.yml", fg = "#b48ead" },
]



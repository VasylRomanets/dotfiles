# Nordfox

[mgr]
cwd = { fg = "#88c0d0" }
find_keyword = { fg = "#ebcb8b", bold = true }
find_position = { fg = "#88c0d0", italic = true }
symlink_target = { fg = "#5a657d", italic = true }
marker_copied = { fg = "#a3be8c", bg = "#a3be8c" }
marker_cut = { fg = "#bf616a", bg = "#bf616a" }
marker_marked = { fg = "#b48ead", bg = "#b48ead" }
marker_selected = { fg = "#88c0d0", bg = "#88c0d0" }
count_copied = { fg = "#2e3440", bg = "#a3be8c" }
count_cut = { fg = "#2e3440", bg = "#bf616a" }
count_selected = { fg = "#2e3440", bg = "#88c0d0" }
border_style = { fg = "#51565f" }

[tabs]
active = { fg = "#cdcecf", bg = "#383d49" }
inactive = { fg = "#5a657d", bg = "#20242d" }

[mode]
normal_main = { fg = "#2e3440", bg = "#88c0d0", bold = true }
normal_alt = { fg = "#88c0d0", bg = "#383d49" }
select_main = { fg = "#2e3440", bg = "#b48ead", bold = true }
select_alt = { fg = "#b48ead", bg = "#383d49" }
unset_main = { fg = "#2e3440", bg = "#c895bf", bold = true }
unset_alt = { fg = "#c895bf", bg = "#383d49" }

[indicator]
parent = { bg = "#383d49" }
current = { bg = "#c7cdd9" }
preview = { bg = "#383d49" }

[status]
overall = { fg = "#cdcecf", bg = "#383d49" }
perm_sep = { fg = "#51565f" }
perm_type = { fg = "#93ccdc" }
perm_read = { fg = "#ebcb8b" }
perm_write = { fg = "#c895bf" }
perm_exec = { fg = "#a3be8c" }
progress_label = { fg = "#cdcecf", bold = true }
progress_normal = { fg = "#88c0d0", bg = "#383d49" }
progress_error = { fg = "#2e3440", bg = "#bf616a" }

[which]
mask = { bg = "#20242d" }
cand = { fg = "#88c0d0" }
rest = { fg = "#5a657d" }
desc = { fg = "#95989d" }
separator_style = { fg = "#51565f" }

[confirm]
border = { fg = "#88c0d0" }
title = { fg = "#88c0d0" }
body = { fg = "#cdcecf" }
list = { fg = "#95989d" }
btn_yes = { fg = "#2e3440", bg = "#88c0d0", bold = true }
btn_no = { fg = "#95989d" }

[spot]
border = { fg = "#88c0d0" }
title = { fg = "#88c0d0" }
tbl_col = { fg = "#93ccdc" }
tbl_cell = { fg = "#2e3440", bg = "#88c0d0" }

[notify]
title_info = { fg = "#81a1c1" }
title_warn = { fg = "#ebcb8b" }
title_error = { fg = "#bf616a" }

[pick]
border = { fg = "#88c0d0" }
active = { fg = "#88c0d0", bold = true }
inactive = { fg = "#95989d" }

[input]
border = { fg = "#88c0d0" }
title = { fg = "#88c0d0" }
value = { fg = "#cdcecf" }
selected = { bg = "#c7cdd9" }

[cmp]
border = { fg = "#88c0d0" }
active = { fg = "#2e3440", bg = "#88c0d0" }
inactive = { fg = "#95989d" }

[tasks]
border = { fg = "#88c0d0" }
title = { fg = "#88c0d0" }
hovered = { fg = "#88c0d0", bold = true }

[help]
on = { fg = "#88c0d0" }
run = { fg = "#95989d" }
desc = { fg = "#5a657d" }
hovered = { bg = "#c7cdd9", bold = true }
footer = { fg = "#5a657d", bg = "#20242d" }

[filetype]
rules = [
  { url = "*/", fg = "#88c0d0", bold = true },
  { mime = "image/*", fg = "#f0d399" },
  { mime = "video/*", fg = "#ebcb8b" },
  { mime = "audio/*", fg = "#ebcb8b" },
  { mime = "application/zip", fg = "#b48ead" },
  { mime = "application/gzip", fg = "#b48ead" },
  { mime = "application/x-tar", fg = "#b48ead" },
  { mime = "application/x-bzip2", fg = "#b48ead" },
  { mime = "application/x-7z-compressed", fg = "#b48ead" },
  { mime = "application/x-rar", fg = "#b48ead" },
  { url = "*.rs", fg = "#f0d399" },
  { url = "*.lua", fg = "#88c0d0" },
  { url = "*.ts", fg = "#88c0d0" },
  { url = "*.js", fg = "#ebcb8b" },
  { url = "*.py", fg = "#a3be8c" },
  { url = "*.go", fg = "#93ccdc" },
  { url = "*.md", fg = "#95989d" },
  { url = "*.json", fg = "#ebcb8b" },
  { url = "*.toml", fg = "#f0d399" },
  { url = "*.yaml", fg = "#c895bf" },
  { url = "*.yml", fg = "#c895bf" },
]



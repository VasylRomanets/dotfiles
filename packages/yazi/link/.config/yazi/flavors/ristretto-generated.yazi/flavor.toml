btn_yes = { fg = "#2c2525", bg = "#f38d70", bold = true }
btn_no = { fg = "#a59a9b" }

[spot]
border = { fg = "#f38d70" }
title = { fg = "#f38d70" }
tbl_col = { fg = "#9bf1e1" }
tbl_cell = { fg = "#2c2525", bg = "#f38d70" }

[notify]
title_info = { fg = "#f38d70" }
title_warn = { fg = "#f9cc6c" }
title_error = { fg = "#fd6883" }

[pick]

find_position = { fg = "#f38d70", italic = true }
symlink_target = { fg = "#72696a", italic = true }
marker_copied = { fg = "#adda78", bg = "#adda78" }
marker_cut = { fg = "#fd6883", bg = "#fd6883" }
marker_marked = { fg = "#a8a9eb", bg = "#a8a9eb" }
marker_selected = { fg = "#f38d70", bg = "#f38d70" }
count_copied = { fg = "#2c2525", bg = "#adda78" }
count_cut = { fg = "#2c2525", bg = "#fd6883" }
count_selected = { fg = "#2c2525", bg = "#f38d70" }

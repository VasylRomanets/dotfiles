inactive = { fg = "#a59a9b" }

[input]
border = { fg = "#f38d70" }
title = { fg = "#f38d70" }
value = { fg = "#e6d9db" }
selected = { bg = "#403e41" }

[cmp]
border = { fg = "#f38d70" }
active = { fg = "#2c2525", bg = "#f38d70" }
inactive = { fg = "#a59a9b" }

[tasks]
border = { fg = "#f38d70" }
title = { fg = "#f38d70" }

[help]
on = { fg = "#f38d70" }
run = { fg = "#a59a9b" }
desc = { fg = "#72696a" }
hovered = { bg = "#403e41", bold = true }
footer = { fg = "#72696a", bg = "#1f1a1a" }

[filetype]
rules = [
  { url = "*/", fg = "#f38d70", bold = true },
  { mime = "image/*", fg = "#fcd675" },
  { mime = "video/*", fg = "#f9cc6c" },
  { mime = "audio/*", fg = "#f9cc6c" },
  { mime = "application/zip", fg = "#a8a9eb" },
  { mime = "application/gzip", fg = "#a8a9eb" },
  { mime = "application/x-tar", fg = "#a8a9eb" },
  { mime = "application/x-bzip2", fg = "#a8a9eb" },
  { mime = "application/x-7z-compressed", fg = "#a8a9eb" },
  { mime = "application/x-rar", fg = "#a8a9eb" },
  { url = "*.rs", fg = "#fcd675" },
  { url = "*.lua", fg = "#f38d70" },
  { url = "*.ts", fg = "#f38d70" },
  { url = "*.js", fg = "#f9cc6c" },
  { url = "*.py", fg = "#adda78" },
  { url = "*.go", fg = "#9bf1e1" },
  { url = "*.md", fg = "#a59a9b" },
  { url = "*.json", fg = "#f9cc6c" },
  { url = "*.toml", fg = "#fcd675" },
  { url = "*.yaml", fg = "#bebffd" },
  { url = "*.yml", fg = "#bebffd" },
]



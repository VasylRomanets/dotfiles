# Rustleaf

[mgr]
cwd = { fg = "#9393c3" }
find_keyword = { fg = "#bdbd89", bold = true }
find_position = { fg = "#9393c3", italic = true }
symlink_target = { fg = "#928374", italic = true }
marker_copied = { fg = "#80b780", bg = "#80b780" }
marker_cut = { fg = "#b27575", bg = "#b27575" }
marker_marked = { fg = "#ae6fae", bg = "#ae6fae" }
marker_selected = { fg = "#9393c3", bg = "#9393c3" }
count_copied = { fg = "#221f20", bg = "#80b780" }
count_cut = { fg = "#221f20", bg = "#b27575" }
count_selected = { fg = "#221f20", bg = "#9393c3" }
border_style = { fg = "#444040" }

[tabs]
active = { fg = "#bcb7b0", bg = "#2b2829" }
inactive = { fg = "#928374", bg = "#181616" }

[mode]
normal_main = { fg = "#221f20", bg = "#9393c3", bold = true }
normal_alt = { fg = "#9393c3", bg = "#2b2829" }
select_main = { fg = "#221f20", bg = "#ae6fae", bold = true }
select_alt = { fg = "#ae6fae", bg = "#2b2829" }
unset_main = { fg = "#221f20", bg = "#c482c4", bold = true }
unset_alt = { fg = "#c482c4", bg = "#2b2829" }

[indicator]
parent = { bg = "#2b2829" }
current = { bg = "#5f5448" }
preview = { bg = "#2b2829" }

[status]
overall = { fg = "#bcb7b0", bg = "#2b2829" }
perm_sep = { fg = "#444040" }
perm_type = { fg = "#90cbcb" }
perm_read = { fg = "#bdbd89" }
perm_write = { fg = "#c482c4" }
perm_exec = { fg = "#80b780" }
progress_label = { fg = "#bcb7b0", bold = true }
progress_normal = { fg = "#9393c3", bg = "#2b2829" }
progress_error = { fg = "#221f20", bg = "#b27575" }

[which]
mask = { bg = "#181616" }
cand = { fg = "#9393c3" }
rest = { fg = "#928374" }
desc = { fg = "#86827e" }
separator_style = { fg = "#444040" }

[confirm]
border = { fg = "#9393c3" }
title = { fg = "#9393c3" }
body = { fg = "#bcb7b0" }
list = { fg = "#86827e" }
btn_yes = { fg = "#221f20", bg = "#9393c3", bold = true }
btn_no = { fg = "#86827e" }

[spot]
border = { fg = "#9393c3" }
title = { fg = "#9393c3" }
tbl_col = { fg = "#90cbcb" }
tbl_cell = { fg = "#221f20", bg = "#9393c3" }

[notify]
title_info = { fg = "#9393c3" }
title_warn = { fg = "#bdbd89" }
title_error = { fg = "#b27575" }

[pick]
border = { fg = "#9393c3" }
active = { fg = "#9393c3", bold = true }
inactive = { fg = "#86827e" }

[input]
border = { fg = "#9393c3" }
title = { fg = "#9393c3" }
value = { fg = "#bcb7b0" }
selected = { bg = "#5f5448" }

[cmp]
border = { fg = "#9393c3" }
active = { fg = "#221f20", bg = "#9393c3" }
inactive = { fg = "#86827e" }

[tasks]
border = { fg = "#9393c3" }
title = { fg = "#9393c3" }
hovered = { fg = "#9393c3", bold = true }

[help]
on = { fg = "#9393c3" }
run = { fg = "#86827e" }
desc = { fg = "#928374" }
hovered = { bg = "#5f5448", bold = true }
footer = { fg = "#928374", bg = "#181616" }

[filetype]
rules = [
  { url = "*/", fg = "#9393c3", bold = true },
  { mime = "image/*", fg = "#dfdfc3" },
  { mime = "video/*", fg = "#bdbd89" },
  { mime = "audio/*", fg = "#bdbd89" },
  { mime = "application/zip", fg = "#ae6fae" },
  { mime = "application/gzip", fg = "#ae6fae" },
  { mime = "application/x-tar", fg = "#ae6fae" },
  { mime = "application/x-bzip2", fg = "#ae6fae" },
  { mime = "application/x-7z-compressed", fg = "#ae6fae" },
  { mime = "application/x-rar", fg = "#ae6fae" },
  { url = "*.rs", fg = "#dfdfc3" },
  { url = "*.lua", fg = "#9393c3" },
  { url = "*.ts", fg = "#9393c3" },
  { url = "*.js", fg = "#bdbd89" },
  { url = "*.py", fg = "#80b780" },
  { url = "*.go", fg = "#90cbcb" },
  { url = "*.md", fg = "#86827e" },
  { url = "*.json", fg = "#bdbd89" },
  { url = "*.toml", fg = "#dfdfc3" },
  { url = "*.yaml", fg = "#c482c4" },
  { url = "*.yml", fg = "#c482c4" },
]



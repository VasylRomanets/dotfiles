# Sora

[mgr]
cwd = { fg = "#80c8e0" }
find_keyword = { fg = "#d4b878", bold = true }
find_position = { fg = "#80c8e0", italic = true }
symlink_target = { fg = "#586478", italic = true }
marker_copied = { fg = "#90c8a0", bg = "#90c8a0" }
marker_cut = { fg = "#c46c78", bg = "#c46c78" }
marker_marked = { fg = "#b0a0d8", bg = "#b0a0d8" }
marker_selected = { fg = "#80c8e0", bg = "#80c8e0" }
count_copied = { fg = "#0e1018", bg = "#90c8a0" }
count_cut = { fg = "#0e1018", bg = "#c46c78" }
count_selected = { fg = "#0e1018", bg = "#80c8e0" }
border_style = { fg = "#373a44" }

[tabs]
active = { fg = "#c8d0e0", bg = "#191c24" }
inactive = { fg = "#586478", bg = "#0a0b11" }

[mode]
normal_main = { fg = "#0e1018", bg = "#80c8e0", bold = true }
normal_alt = { fg = "#80c8e0", bg = "#191c24" }
select_main = { fg = "#0e1018", bg = "#b0a0d8", bold = true }
select_alt = { fg = "#b0a0d8", bg = "#191c24" }
unset_main = { fg = "#0e1018", bg = "#c4b4e8", bold = true }
unset_alt = { fg = "#c4b4e8", bg = "#191c24" }

[indicator]
parent = { bg = "#191c24" }
current = { bg = "#1e2430" }
preview = { bg = "#191c24" }

[status]
overall = { fg = "#c8d0e0", bg = "#191c24" }
perm_sep = { fg = "#373a44" }
perm_type = { fg = "#90d0c8" }
perm_read = { fg = "#d4b878" }
perm_write = { fg = "#c4b4e8" }
perm_exec = { fg = "#90c8a0" }
progress_label = { fg = "#c8d0e0", bold = true }
progress_normal = { fg = "#80c8e0", bg = "#191c24" }
progress_error = { fg = "#0e1018", bg = "#c46c78" }

[which]
mask = { bg = "#0a0b11" }
cand = { fg = "#80c8e0" }
rest = { fg = "#586478" }
desc = { fg = "#878d9a" }
separator_style = { fg = "#373a44" }

[confirm]
border = { fg = "#80c8e0" }
title = { fg = "#80c8e0" }
body = { fg = "#c8d0e0" }
list = { fg = "#878d9a" }
btn_yes = { fg = "#0e1018", bg = "#80c8e0", bold = true }
btn_no = { fg = "#878d9a" }

[spot]
border = { fg = "#80c8e0" }
title = { fg = "#80c8e0" }
tbl_col = { fg = "#90d0c8" }
tbl_cell = { fg = "#0e1018", bg = "#80c8e0" }

[notify]
title_info = { fg = "#80c8e0" }
title_warn = { fg = "#d4b878" }
title_error = { fg = "#c46c78" }

[pick]
border = { fg = "#80c8e0" }
active = { fg = "#80c8e0", bold = true }
inactive = { fg = "#878d9a" }

[input]
border = { fg = "#80c8e0" }
title = { fg = "#80c8e0" }
value = { fg = "#c8d0e0" }
selected = { bg = "#1e2430" }

[cmp]
border = { fg = "#80c8e0" }
active = { fg = "#0e1018", bg = "#80c8e0" }
inactive = { fg = "#878d9a" }

[tasks]
border = { fg = "#80c8e0" }
title = { fg = "#80c8e0" }
hovered = { fg = "#80c8e0", bold = true }

[help]
on = { fg = "#80c8e0" }
run = { fg = "#878d9a" }
desc = { fg = "#586478" }
hovered = { bg = "#1e2430", bold = true }
footer = { fg = "#586478", bg = "#0a0b11" }

[filetype]
rules = [
  { url = "*/", fg = "#80c8e0", bold = true },
  { mime = "image/*", fg = "#e0c888" },
  { mime = "video/*", fg = "#d4b878" },
  { mime = "audio/*", fg = "#d4b878" },
  { mime = "application/zip", fg = "#b0a0d8" },
  { mime = "application/gzip", fg = "#b0a0d8" },
  { mime = "application/x-tar", fg = "#b0a0d8" },
  { mime = "application/x-bzip2", fg = "#b0a0d8" },
  { mime = "application/x-7z-compressed", fg = "#b0a0d8" },
  { mime = "application/x-rar", fg = "#b0a0d8" },
  { url = "*.rs", fg = "#e0c888" },
  { url = "*.lua", fg = "#80c8e0" },
  { url = "*.ts", fg = "#80c8e0" },
  { url = "*.js", fg = "#d4b878" },
  { url = "*.py", fg = "#90c8a0" },
  { url = "*.go", fg = "#90d0c8" },
  { url = "*.md", fg = "#878d9a" },
  { url = "*.json", fg = "#d4b878" },
  { url = "*.toml", fg = "#e0c888" },
  { url = "*.yaml", fg = "#c4b4e8" },
  { url = "*.yml", fg = "#c4b4e8" },
]



inactive = { fg = "#8e908c", bg = "#ededed" }

[mode]
normal_main = { fg = "#ffffff", bg = "#3e999f", bold = true }
normal_alt = { fg = "#3e999f", bg = "#f4f4f4" }
select_main = { fg = "#ffffff", bg = "#8959a8", bold = true }
select_alt = { fg = "#8959a8", bg = "#f4f4f4" }
unset_main = { fg = "#ffffff", bg = "#8959a8", bold = true }
unset_alt = { fg = "#8959a8", bg = "#f4f4f4" }

[indicator]
parent = { bg = "#f4f4f4" }
current = { bg = "#d6d6d6" }
preview = { bg = "#f4f4f4" }

[status]
overall = { fg = "#4d4d4c", bg = "#f4f4f4" }
perm_sep = { fg = "#d8d8d8" }
perm_type = { fg = "#3e999f" }
perm_read = { fg = "#eab700" }
perm_write = { fg = "#8959a8" }
perm_exec = { fg = "#718c00" }
progress_label = { fg = "#4d4d4c", bold = true }
progress_normal = { fg = "#3e999f", bg = "#f4f4f4" }
progress_error = { fg = "#ffffff", bg = "#c82829" }

[which]
mask = { bg = "#ededed" }
cand = { fg = "#3e999f" }
rest = { fg = "#8e908c" }
desc = { fg = "#8b8b8b" }
separator_style = { fg = "#d8d8d8" }

[confirm]
border = { fg = "#3e999f" }
title = { fg = "#3e999f" }
body = { fg = "#4d4d4c" }
list = { fg = "#8b8b8b" }
btn_yes = { fg = "#ffffff", bg = "#3e999f", bold = true }
btn_no = { fg = "#8b8b8b" }

[spot]
border = { fg = "#3e999f" }
title = { fg = "#3e999f" }
tbl_col = { fg = "#3e999f" }
tbl_cell = { fg = "#ffffff", bg = "#3e999f" }

[notify]
title_info = { fg = "#4271ae" }
title_warn = { fg = "#eab700" }
title_error = { fg = "#c82829" }

[pick]
border = { fg = "#3e999f" }
active = { fg = "#3e999f", bold = true }
inactive = { fg = "#8b8b8b" }

[input]
border = { fg = "#3e999f" }
title = { fg = "#3e999f" }
value = { fg = "#4d4d4c" }
selected = { bg = "#d6d6d6" }

[cmp]
border = { fg = "#3e999f" }
active = { fg = "#ffffff", bg = "#3e999f" }
inactive = { fg = "#8b8b8b" }

[tasks]
border = { fg = "#3e999f" }
title = { fg = "#3e999f" }
hovered = { fg = "#3e999f", bold = true }

[help]
on = { fg = "#3e999f" }
run = { fg = "#8b8b8b" }
desc = { fg = "#8e908c" }
hovered = { bg = "#d6d6d6", bold = true }
footer = { fg = "#8e908c", bg = "#ededed" }

[filetype]
rules = [
  { url = "*/", fg = "#3e999f", bold = true },
  { mime = "image/*", fg = "#eab700" },
  { mime = "video/*", fg = "#eab700" },
  { mime = "audio/*", fg = "#eab700" },
  { mime = "application/zip", fg = "#8959a8" },
  { mime = "application/gzip", fg = "#8959a8" },
  { mime = "application/x-tar", fg = "#8959a8" },
  { mime = "application/x-bzip2", fg = "#8959a8" },
  { mime = "application/x-7z-compressed", fg = "#8959a8" },
  { mime = "application/x-rar", fg = "#8959a8" },
  { url = "*.rs", fg = "#eab700" },
  { url = "*.lua", fg = "#3e999f" },
  { url = "*.ts", fg = "#3e999f" },
  { url = "*.js", fg = "#eab700" },
  { url = "*.py", fg = "#718c00" },
  { url = "*.go", fg = "#3e999f" },
  { url = "*.md", fg = "#8b8b8b" },
  { url = "*.json", fg = "#eab700" },
  { url = "*.toml", fg = "#eab700" },
  { url = "*.yaml", fg = "#8959a8" },
  { url = "*.yml", fg = "#8959a8" },
]



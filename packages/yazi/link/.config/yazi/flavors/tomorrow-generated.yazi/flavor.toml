# Tomorrow

[mgr]
cwd = { fg = "#3e999f" }
find_keyword = { fg = "#eab700", bold = true }
find_position = { fg = "#3e999f", italic = true }
symlink_target = { fg = "#8e908c", italic = true }
marker_copied = { fg = "#718c00", bg = "#718c00" }
marker_cut = { fg = "#c82829", bg = "#c82829" }
marker_marked = { fg = "#8959a8", bg = "#8959a8" }
marker_selected = { fg = "#3e999f", bg = "#3e999f" }
count_copied = { fg = "#ffffff", bg = "#718c00" }
count_cut = { fg = "#ffffff", bg = "#c82829" }
count_selected = { fg = "#ffffff", bg = "#3e999f" }
border_style = { fg = "#d8d8d8" }

[tabs]

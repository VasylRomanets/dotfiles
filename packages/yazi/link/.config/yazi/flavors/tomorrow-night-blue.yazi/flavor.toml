# Tomorrow Night Blue

[mgr]
cwd = { fg = "#99ffff" }
find_keyword = { fg = "#ffeead", bold = true }
find_position = { fg = "#99ffff", italic = true }
symlink_target = { fg = "#7285b7", italic = true }
marker_copied = { fg = "#d1f1a9", bg = "#d1f1a9" }
marker_cut = { fg = "#ff9da4", bg = "#ff9da4" }
marker_marked = { fg = "#ebbbff", bg = "#ebbbff" }
marker_selected = { fg = "#99ffff", bg = "#99ffff" }
count_copied = { fg = "#002451", bg = "#d1f1a9" }
count_cut = { fg = "#002451", bg = "#ff9da4" }
count_selected = { fg = "#002451", bg = "#99ffff" }
border_style = { fg = "#385477" }

[tabs]
active = { fg = "#ffffff", bg = "#0f315b" }
inactive = { fg = "#7285b7", bg = "#001939" }

[mode]
normal_main = { fg = "#002451", bg = "#99ffff", bold = true }
normal_alt = { fg = "#99ffff", bg = "#0f315b" }
select_main = { fg = "#002451", bg = "#ebbbff", bold = true }
select_alt = { fg = "#ebbbff", bg = "#0f315b" }
unset_main = { fg = "#002451", bg = "#ebbbff", bold = true }
unset_alt = { fg = "#ebbbff", bg = "#0f315b" }

[indicator]
parent = { bg = "#0f315b" }
current = { bg = "#003f8e" }
preview = { bg = "#0f315b" }

[status]
overall = { fg = "#ffffff", bg = "#0f315b" }
perm_sep = { fg = "#385477" }
perm_type = { fg = "#99ffff" }
perm_read = { fg = "#ffeead" }
perm_write = { fg = "#ebbbff" }
perm_exec = { fg = "#d1f1a9" }
progress_label = { fg = "#ffffff", bold = true }
progress_normal = { fg = "#99ffff", bg = "#0f315b" }
progress_error = { fg = "#002451", bg = "#ff9da4" }

[which]
mask = { bg = "#001939" }
cand = { fg = "#99ffff" }
rest = { fg = "#7285b7" }
desc = { fg = "#a6b2c2" }
separator_style = { fg = "#385477" }

[confirm]
border = { fg = "#99ffff" }
title = { fg = "#99ffff" }
body = { fg = "#ffffff" }
list = { fg = "#a6b2c2" }
btn_yes = { fg = "#002451", bg = "#99ffff", bold = true }
btn_no = { fg = "#a6b2c2" }

[spot]
border = { fg = "#99ffff" }
title = { fg = "#99ffff" }
tbl_col = { fg = "#99ffff" }
tbl_cell = { fg = "#002451", bg = "#99ffff" }

[notify]
title_info = { fg = "#bbdaff" }
title_warn = { fg = "#ffeead" }
title_error = { fg = "#ff9da4" }

[pick]
border = { fg = "#99ffff" }
active = { fg = "#99ffff", bold = true }
inactive = { fg = "#a6b2c2" }

[input]
border = { fg = "#99ffff" }
title = { fg = "#99ffff" }
value = { fg = "#ffffff" }
selected = { bg = "#003f8e" }

[cmp]
border = { fg = "#99ffff" }
active = { fg = "#002451", bg = "#99ffff" }
inactive = { fg = "#a6b2c2" }

[tasks]
border = { fg = "#99ffff" }
title = { fg = "#99ffff" }
hovered = { fg = "#99ffff", bold = true }

[help]
on = { fg = "#99ffff" }
run = { fg = "#a6b2c2" }
desc = { fg = "#7285b7" }
hovered = { bg = "#003f8e", bold = true }
footer = { fg = "#7285b7", bg = "#001939" }

[filetype]
rules = [
  { url = "*/", fg = "#99ffff", bold = true },
  { mime = "image/*", fg = "#ffeead" },
  { mime = "video/*", fg = "#ffeead" },
  { mime = "audio/*", fg = "#ffeead" },
  { mime = "application/zip", fg = "#ebbbff" },
  { mime = "application/gzip", fg = "#ebbbff" },
  { mime = "application/x-tar", fg = "#ebbbff" },
  { mime = "application/x-bzip2", fg = "#ebbbff" },
  { mime = "application/x-7z-compressed", fg = "#ebbbff" },
  { mime = "application/x-rar", fg = "#ebbbff" },
  { url = "*.rs", fg = "#ffeead" },
  { url = "*.lua", fg = "#99ffff" },
  { url = "*.ts", fg = "#99ffff" },
  { url = "*.js", fg = "#ffeead" },
  { url = "*.py", fg = "#d1f1a9" },
  { url = "*.go", fg = "#99ffff" },
  { url = "*.md", fg = "#a6b2c2" },
  { url = "*.json", fg = "#ffeead" },
  { url = "*.toml", fg = "#ffeead" },
  { url = "*.yaml", fg = "#ebbbff" },
  { url = "*.yml", fg = "#ebbbff" },
]



# Tomorrow Night Bright

[mgr]
cwd = { fg = "#70c0b1" }
find_keyword = { fg = "#e7c547", bold = true }
find_position = { fg = "#70c0b1", italic = true }
symlink_target = { fg = "#969896", italic = true }
marker_copied = { fg = "#b9ca4a", bg = "#b9ca4a" }
marker_cut = { fg = "#d54e53", bg = "#d54e53" }
marker_marked = { fg = "#c397d8", bg = "#c397d8" }
marker_selected = { fg = "#70c0b1", bg = "#70c0b1" }
count_copied = { fg = "#000000", bg = "#b9ca4a" }
count_cut = { fg = "#000000", bg = "#d54e53" }
count_selected = { fg = "#000000", bg = "#70c0b1" }
border_style = { fg = "#333333" }

[tabs]
active = { fg = "#eaeaea", bg = "#0e0e0e" }
inactive = { fg = "#969896", bg = "#000000" }

[mode]
normal_main = { fg = "#000000", bg = "#70c0b1", bold = true }
normal_alt = { fg = "#70c0b1", bg = "#0e0e0e" }
select_main = { fg = "#000000", bg = "#c397d8", bold = true }
select_alt = { fg = "#c397d8", bg = "#0e0e0e" }
unset_main = { fg = "#000000", bg = "#c397d8", bold = true }
unset_alt = { fg = "#c397d8", bg = "#0e0e0e" }

[indicator]
parent = { bg = "#0e0e0e" }
current = { bg = "#424242" }
preview = { bg = "#0e0e0e" }

[status]
overall = { fg = "#eaeaea", bg = "#0e0e0e" }
perm_sep = { fg = "#333333" }
perm_type = { fg = "#70c0b1" }
perm_read = { fg = "#e7c547" }
perm_write = { fg = "#c397d8" }
perm_exec = { fg = "#b9ca4a" }
progress_label = { fg = "#eaeaea", bold = true }
progress_normal = { fg = "#70c0b1", bg = "#0e0e0e" }
progress_error = { fg = "#000000", bg = "#d54e53" }

[which]
mask = { bg = "#000000" }
cand = { fg = "#70c0b1" }
rest = { fg = "#969896" }
desc = { fg = "#989898" }
separator_style = { fg = "#333333" }

[confirm]
border = { fg = "#70c0b1" }
title = { fg = "#70c0b1" }
body = { fg = "#eaeaea" }
list = { fg = "#989898" }
btn_yes = { fg = "#000000", bg = "#70c0b1", bold = true }
btn_no = { fg = "#989898" }

[spot]
border = { fg = "#70c0b1" }
title = { fg = "#70c0b1" }
tbl_col = { fg = "#70c0b1" }
tbl_cell = { fg = "#000000", bg = "#70c0b1" }

[notify]
title_info = { fg = "#7aa6da" }
title_warn = { fg = "#e7c547" }
title_error = { fg = "#d54e53" }

[pick]
border = { fg = "#70c0b1" }
active = { fg = "#70c0b1", bold = true }
inactive = { fg = "#989898" }

[input]
border = { fg = "#70c0b1" }
title = { fg = "#70c0b1" }
value = { fg = "#eaeaea" }
selected = { bg = "#424242" }

[cmp]
border = { fg = "#70c0b1" }
active = { fg = "#000000", bg = "#70c0b1" }
inactive = { fg = "#989898" }

[tasks]
border = { fg = "#70c0b1" }
title = { fg = "#70c0b1" }
hovered = { fg = "#70c0b1", bold = true }

[help]
on = { fg = "#70c0b1" }
run = { fg = "#989898" }
desc = { fg = "#969896" }
hovered = { bg = "#424242", bold = true }
footer = { fg = "#969896", bg = "#000000" }

[filetype]
rules = [
  { url = "*/", fg = "#70c0b1", bold = true },
  { mime = "image/*", fg = "#e7c547" },
  { mime = "video/*", fg = "#e7c547" },
  { mime = "audio/*", fg = "#e7c547" },
  { mime = "application/zip", fg = "#c397d8" },
  { mime = "application/gzip", fg = "#c397d8" },
  { mime = "application/x-tar", fg = "#c397d8" },
  { mime = "application/x-bzip2", fg = "#c397d8" },
  { mime = "application/x-7z-compressed", fg = "#c397d8" },
  { mime = "application/x-rar", fg = "#c397d8" },
  { url = "*.rs", fg = "#e7c547" },
  { url = "*.lua", fg = "#70c0b1" },
  { url = "*.ts", fg = "#70c0b1" },
  { url = "*.js", fg = "#e7c547" },
  { url = "*.py", fg = "#b9ca4a" },
  { url = "*.go", fg = "#70c0b1" },
  { url = "*.md", fg = "#989898" },
  { url = "*.json", fg = "#e7c547" },
  { url = "*.toml", fg = "#e7c547" },
  { url = "*.yaml", fg = "#c397d8" },
  { url = "*.yml", fg = "#c397d8" },
]



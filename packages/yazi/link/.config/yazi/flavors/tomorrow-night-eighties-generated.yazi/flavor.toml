# Tomorrow Night Eighties

[mgr]
cwd = { fg = "#66cccc" }
find_keyword = { fg = "#ffcc66", bold = true }
find_position = { fg = "#66cccc", italic = true }
symlink_target = { fg = "#999999", italic = true }
marker_copied = { fg = "#99cc99", bg = "#99cc99" }
marker_cut = { fg = "#f2777a", bg = "#f2777a" }
marker_marked = { fg = "#cc99cc", bg = "#cc99cc" }
marker_selected = { fg = "#66cccc", bg = "#66cccc" }
count_copied = { fg = "#2d2d2d", bg = "#99cc99" }
count_cut = { fg = "#2d2d2d", bg = "#f2777a" }
count_selected = { fg = "#2d2d2d", bg = "#66cccc" }
border_style = { fg = "#505050" }

[tabs]
active = { fg = "#cccccc", bg = "#373737" }
inactive = { fg = "#999999", bg = "#1f1f1f" }

[mode]
normal_main = { fg = "#2d2d2d", bg = "#66cccc", bold = true }
normal_alt = { fg = "#66cccc", bg = "#373737" }
select_main = { fg = "#2d2d2d", bg = "#cc99cc", bold = true }
select_alt = { fg = "#cc99cc", bg = "#373737" }
unset_main = { fg = "#2d2d2d", bg = "#cc99cc", bold = true }
unset_alt = { fg = "#cc99cc", bg = "#373737" }

[indicator]
parent = { bg = "#373737" }
current = { bg = "#515151" }
preview = { bg = "#373737" }

[status]
overall = { fg = "#cccccc", bg = "#373737" }
perm_sep = { fg = "#505050" }
perm_type = { fg = "#66cccc" }
perm_read = { fg = "#ffcc66" }
perm_write = { fg = "#cc99cc" }
perm_exec = { fg = "#99cc99" }
progress_label = { fg = "#cccccc", bold = true }
progress_normal = { fg = "#66cccc", bg = "#373737" }
progress_error = { fg = "#2d2d2d", bg = "#f2777a" }

[which]
mask = { bg = "#1f1f1f" }
cand = { fg = "#66cccc" }
rest = { fg = "#999999" }
desc = { fg = "#949494" }
separator_style = { fg = "#505050" }

[confirm]
border = { fg = "#66cccc" }
title = { fg = "#66cccc" }
body = { fg = "#cccccc" }
list = { fg = "#949494" }
btn_yes = { fg = "#2d2d2d", bg = "#66cccc", bold = true }
btn_no = { fg = "#949494" }

[spot]
border = { fg = "#66cccc" }
title = { fg = "#66cccc" }
tbl_col = { fg = "#66cccc" }
tbl_cell = { fg = "#2d2d2d", bg = "#66cccc" }

[notify]
title_info = { fg = "#6699cc" }
title_warn = { fg = "#ffcc66" }
title_error = { fg = "#f2777a" }

[pick]
border = { fg = "#66cccc" }
active = { fg = "#66cccc", bold = true }
inactive = { fg = "#949494" }

[input]
border = { fg = "#66cccc" }
title = { fg = "#66cccc" }
value = { fg = "#cccccc" }
selected = { bg = "#515151" }

[cmp]
border = { fg = "#66cccc" }
active = { fg = "#2d2d2d", bg = "#66cccc" }
inactive = { fg = "#949494" }

[tasks]
border = { fg = "#66cccc" }
title = { fg = "#66cccc" }
hovered = { fg = "#66cccc", bold = true }

[help]
on = { fg = "#66cccc" }
run = { fg = "#949494" }
desc = { fg = "#999999" }
hovered = { bg = "#515151", bold = true }
footer = { fg = "#999999", bg = "#1f1f1f" }

[filetype]
rules = [
  { url = "*/", fg = "#66cccc", bold = true },
  { mime = "image/*", fg = "#ffcc66" },
  { mime = "video/*", fg = "#ffcc66" },
  { mime = "audio/*", fg = "#ffcc66" },
  { mime = "application/zip", fg = "#cc99cc" },
  { mime = "application/gzip", fg = "#cc99cc" },
  { mime = "application/x-tar", fg = "#cc99cc" },
  { mime = "application/x-bzip2", fg = "#cc99cc" },
  { mime = "application/x-7z-compressed", fg = "#cc99cc" },
  { mime = "application/x-rar", fg = "#cc99cc" },
  { url = "*.rs", fg = "#ffcc66" },
  { url = "*.lua", fg = "#66cccc" },
  { url = "*.ts", fg = "#66cccc" },
  { url = "*.js", fg = "#ffcc66" },
  { url = "*.py", fg = "#99cc99" },
  { url = "*.go", fg = "#66cccc" },
  { url = "*.md", fg = "#949494" },
  { url = "*.json", fg = "#ffcc66" },
  { url = "*.toml", fg = "#ffcc66" },
  { url = "*.yaml", fg = "#cc99cc" },
  { url = "*.yml", fg = "#cc99cc" },
]



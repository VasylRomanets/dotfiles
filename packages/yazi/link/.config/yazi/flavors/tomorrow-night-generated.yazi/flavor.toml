# Tomorrow Night

[mgr]
cwd = { fg = "#8abeb7" }
find_keyword = { fg = "#f0c674", bold = true }
find_position = { fg = "#8abeb7", italic = true }
symlink_target = { fg = "#969896", italic = true }
marker_copied = { fg = "#b5bd68", bg = "#b5bd68" }
marker_cut = { fg = "#cc6666", bg = "#cc6666" }
marker_marked = { fg = "#b294bb", bg = "#b294bb" }
marker_selected = { fg = "#8abeb7", bg = "#8abeb7" }
count_copied = { fg = "#1d1f21", bg = "#b5bd68" }
count_cut = { fg = "#1d1f21", bg = "#cc6666" }
count_selected = { fg = "#1d1f21", bg = "#8abeb7" }
border_style = { fg = "#424445" }

[tabs]
active = { fg = "#c5c8c6", bg = "#27292b" }
inactive = { fg = "#969896", bg = "#141617" }

[mode]
normal_main = { fg = "#1d1f21", bg = "#8abeb7", bold = true }
normal_alt = { fg = "#8abeb7", bg = "#27292b" }
select_main = { fg = "#1d1f21", bg = "#b294bb", bold = true }
select_alt = { fg = "#b294bb", bg = "#27292b" }
unset_main = { fg = "#1d1f21", bg = "#b294bb", bold = true }
unset_alt = { fg = "#b294bb", bg = "#27292b" }

[indicator]
parent = { bg = "#27292b" }
current = { bg = "#373b41" }
preview = { bg = "#27292b" }

[status]
overall = { fg = "#c5c8c6", bg = "#27292b" }
perm_sep = { fg = "#424445" }
perm_type = { fg = "#8abeb7" }
perm_read = { fg = "#f0c674" }
perm_write = { fg = "#b294bb" }
perm_exec = { fg = "#b5bd68" }
progress_label = { fg = "#c5c8c6", bold = true }
progress_normal = { fg = "#8abeb7", bg = "#27292b" }
progress_error = { fg = "#1d1f21", bg = "#cc6666" }

[which]
mask = { bg = "#141617" }
cand = { fg = "#8abeb7" }
rest = { fg = "#969896" }
desc = { fg = "#8a8d8c" }
separator_style = { fg = "#424445" }

[confirm]
border = { fg = "#8abeb7" }
title = { fg = "#8abeb7" }
body = { fg = "#c5c8c6" }
list = { fg = "#8a8d8c" }
btn_yes = { fg = "#1d1f21", bg = "#8abeb7", bold = true }
btn_no = { fg = "#8a8d8c" }

[spot]
border = { fg = "#8abeb7" }
title = { fg = "#8abeb7" }
tbl_col = { fg = "#8abeb7" }
tbl_cell = { fg = "#1d1f21", bg = "#8abeb7" }

[notify]
title_info = { fg = "#81a2be" }
title_warn = { fg = "#f0c674" }
title_error = { fg = "#cc6666" }

[pick]
border = { fg = "#8abeb7" }
active = { fg = "#8abeb7", bold = true }
inactive = { fg = "#8a8d8c" }

[input]
border = { fg = "#8abeb7" }
title = { fg = "#8abeb7" }
value = { fg = "#c5c8c6" }
selected = { bg = "#373b41" }

[cmp]
border = { fg = "#8abeb7" }
active = { fg = "#1d1f21", bg = "#8abeb7" }
inactive = { fg = "#8a8d8c" }

[tasks]
border = { fg = "#8abeb7" }
title = { fg = "#8abeb7" }
hovered = { fg = "#8abeb7", bold = true }

[help]
on = { fg = "#8abeb7" }
run = { fg = "#8a8d8c" }
desc = { fg = "#969896" }
hovered = { bg = "#373b41", bold = true }
footer = { fg = "#969896", bg = "#141617" }

[filetype]
rules = [
  { url = "*/", fg = "#8abeb7", bold = true },
  { mime = "image/*", fg = "#f0c674" },
  { mime = "video/*", fg = "#f0c674" },
  { mime = "audio/*", fg = "#f0c674" },
  { mime = "application/zip", fg = "#b294bb" },
  { mime = "application/gzip", fg = "#b294bb" },
  { mime = "application/x-tar", fg = "#b294bb" },
  { mime = "application/x-bzip2", fg = "#b294bb" },
  { mime = "application/x-7z-compressed", fg = "#b294bb" },
  { mime = "application/x-rar", fg = "#b294bb" },
  { url = "*.rs", fg = "#f0c674" },
  { url = "*.lua", fg = "#8abeb7" },
  { url = "*.ts", fg = "#8abeb7" },
  { url = "*.js", fg = "#f0c674" },
  { url = "*.py", fg = "#b5bd68" },
  { url = "*.go", fg = "#8abeb7" },
  { url = "*.md", fg = "#8a8d8c" },
  { url = "*.json", fg = "#f0c674" },
  { url = "*.toml", fg = "#f0c674" },
  { url = "*.yaml", fg = "#b294bb" },
  { url = "*.yml", fg = "#b294bb" },
]



# Tundra Arctic

[mgr]
cwd = { fg = "#bae6fd" }
find_keyword = { fg = "#fbc19d", bold = true }
find_position = { fg = "#bae6fd", italic = true }
symlink_target = { fg = "#6b7280", italic = true }
marker_copied = { fg = "#b1e3ad", bg = "#b1e3ad" }
marker_cut = { fg = "#fca5a5", bg = "#fca5a5" }
marker_marked = { fg = "#957fb8", bg = "#957fb8" }
marker_selected = { fg = "#bae6fd", bg = "#bae6fd" }
count_copied = { fg = "#111827", bg = "#b1e3ad" }
count_cut = { fg = "#111827", bg = "#fca5a5" }
count_selected = { fg = "#111827", bg = "#bae6fd" }
border_style = { fg = "#3b424f" }

[tabs]
active = { fg = "#d1d5db", bg = "#1d2332" }
inactive = { fg = "#6b7280", bg = "#0c111b" }

[mode]
normal_main = { fg = "#111827", bg = "#bae6fd", bold = true }
normal_alt = { fg = "#bae6fd", bg = "#1d2332" }
select_main = { fg = "#111827", bg = "#957fb8", bold = true }
select_alt = { fg = "#957fb8", bg = "#1d2332" }
unset_main = { fg = "#111827", bg = "#938aa9", bold = true }
unset_alt = { fg = "#938aa9", bg = "#1d2332" }

[indicator]
parent = { bg = "#1d2332" }
current = { bg = "#374151" }
preview = { bg = "#1d2332" }

[status]
overall = { fg = "#d1d5db", bg = "#1d2332" }
perm_sep = { fg = "#3b424f" }
perm_type = { fg = "#ddd6fe" }
perm_read = { fg = "#fbc19d" }
perm_write = { fg = "#938aa9" }
perm_exec = { fg = "#b1e3ad" }
progress_label = { fg = "#d1d5db", bold = true }
progress_normal = { fg = "#bae6fd", bg = "#1d2332" }
progress_error = { fg = "#111827", bg = "#fca5a5" }

[which]
mask = { bg = "#0c111b" }
cand = { fg = "#bae6fd" }
rest = { fg = "#6b7280" }
desc = { fg = "#8e939c" }
separator_style = { fg = "#3b424f" }

[confirm]
border = { fg = "#bae6fd" }
title = { fg = "#bae6fd" }
body = { fg = "#d1d5db" }
list = { fg = "#8e939c" }
btn_yes = { fg = "#111827", bg = "#bae6fd", bold = true }
btn_no = { fg = "#8e939c" }

[spot]
border = { fg = "#bae6fd" }
title = { fg = "#bae6fd" }
tbl_col = { fg = "#ddd6fe" }
tbl_cell = { fg = "#111827", bg = "#bae6fd" }

[notify]
title_info = { fg = "#bae6fd" }
title_warn = { fg = "#fbc19d" }
title_error = { fg = "#fca5a5" }

[pick]
border = { fg = "#bae6fd" }
active = { fg = "#bae6fd", bold = true }
inactive = { fg = "#8e939c" }

[input]
border = { fg = "#bae6fd" }
title = { fg = "#bae6fd" }
value = { fg = "#d1d5db" }
selected = { bg = "#374151" }

[cmp]
border = { fg = "#bae6fd" }
active = { fg = "#111827", bg = "#bae6fd" }
inactive = { fg = "#8e939c" }

[tasks]
border = { fg = "#bae6fd" }
title = { fg = "#bae6fd" }
hovered = { fg = "#bae6fd", bold = true }

[help]
on = { fg = "#bae6fd" }
run = { fg = "#8e939c" }
desc = { fg = "#6b7280" }
hovered = { bg = "#374151", bold = true }
footer = { fg = "#6b7280", bg = "#0c111b" }

[filetype]
rules = [
  { url = "*/", fg = "#bae6fd", bold = true },
  { mime = "image/*", fg = "#fbc19d" },
  { mime = "video/*", fg = "#fbc19d" },
  { mime = "audio/*", fg = "#fbc19d" },
  { mime = "application/zip", fg = "#957fb8" },
  { mime = "application/gzip", fg = "#957fb8" },
  { mime = "application/x-tar", fg = "#957fb8" },
  { mime = "application/x-bzip2", fg = "#957fb8" },
  { mime = "application/x-7z-compressed", fg = "#957fb8" },
  { mime = "application/x-rar", fg = "#957fb8" },
  { url = "*.rs", fg = "#fbc19d" },
  { url = "*.lua", fg = "#bae6fd" },
  { url = "*.ts", fg = "#bae6fd" },
  { url = "*.js", fg = "#fbc19d" },
  { url = "*.py", fg = "#b1e3ad" },
  { url = "*.go", fg = "#ddd6fe" },
  { url = "*.md", fg = "#8e939c" },
  { url = "*.json", fg = "#fbc19d" },
  { url = "*.toml", fg = "#fbc19d" },
  { url = "*.yaml", fg = "#938aa9" },
  { url = "*.yml", fg = "#938aa9" },
]



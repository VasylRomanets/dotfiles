# Tundra Jungle

[mgr]
cwd = { fg = "#acd5fc" }
find_keyword = { fg = "#f5cfa9", bold = true }
find_position = { fg = "#acd5fc", italic = true }
symlink_target = { fg = "#767676", italic = true }
marker_copied = { fg = "#afd7af", bg = "#afd7af" }
marker_cut = { fg = "#ffafaf", bg = "#ffafaf" }
marker_marked = { fg = "#b5b5ff", bg = "#b5b5ff" }
marker_selected = { fg = "#acd5fc", bg = "#acd5fc" }
count_copied = { fg = "#1c1c1c", bg = "#afd7af" }
count_cut = { fg = "#1c1c1c", bg = "#ffafaf" }
count_selected = { fg = "#1c1c1c", bg = "#acd5fc" }
border_style = { fg = "#444546" }

[tabs]
active = { fg = "#d1d5db", bg = "#272727" }
inactive = { fg = "#767676", bg = "#141414" }

[mode]
normal_main = { fg = "#1c1c1c", bg = "#acd5fc", bold = true }
normal_alt = { fg = "#acd5fc", bg = "#272727" }
select_main = { fg = "#1c1c1c", bg = "#b5b5ff", bold = true }
select_alt = { fg = "#b5b5ff", bg = "#272727" }
unset_main = { fg = "#1c1c1c", bg = "#b5b5ff", bold = true }
unset_alt = { fg = "#b5b5ff", bg = "#272727" }

[indicator]
parent = { bg = "#272727" }
current = { bg = "#444444" }
preview = { bg = "#272727" }

[status]
overall = { fg = "#d1d5db", bg = "#272727" }
perm_sep = { fg = "#444546" }
perm_type = { fg = "#d7d7ff" }
perm_read = { fg = "#f5cfa9" }
perm_write = { fg = "#b5b5ff" }
perm_exec = { fg = "#afd7af" }
progress_label = { fg = "#d1d5db", bold = true }
progress_normal = { fg = "#acd5fc", bg = "#272727" }
progress_error = { fg = "#1c1c1c", bg = "#ffafaf" }

[which]
mask = { bg = "#141414" }
cand = { fg = "#acd5fc" }
rest = { fg = "#767676" }
desc = { fg = "#929498" }
separator_style = { fg = "#444546" }

[confirm]
border = { fg = "#acd5fc" }
title = { fg = "#acd5fc" }
body = { fg = "#d1d5db" }
list = { fg = "#929498" }
btn_yes = { fg = "#1c1c1c", bg = "#acd5fc", bold = true }
btn_no = { fg = "#929498" }

[spot]
border = { fg = "#acd5fc" }
title = { fg = "#acd5fc" }
tbl_col = { fg = "#d7d7ff" }
tbl_cell = { fg = "#1c1c1c", bg = "#acd5fc" }

[notify]
title_info = { fg = "#acd5fc" }
title_warn = { fg = "#f5cfa9" }
title_error = { fg = "#ffafaf" }

[pick]
border = { fg = "#acd5fc" }
active = { fg = "#acd5fc", bold = true }
inactive = { fg = "#929498" }

[input]
border = { fg = "#acd5fc" }
title = { fg = "#acd5fc" }
value = { fg = "#d1d5db" }
selected = { bg = "#444444" }

[cmp]
border = { fg = "#acd5fc" }
active = { fg = "#1c1c1c", bg = "#acd5fc" }
inactive = { fg = "#929498" }

[tasks]
border = { fg = "#acd5fc" }
title = { fg = "#acd5fc" }
hovered = { fg = "#acd5fc", bold = true }

[help]
on = { fg = "#acd5fc" }
run = { fg = "#929498" }
desc = { fg = "#767676" }
hovered = { bg = "#444444", bold = true }
footer = { fg = "#767676", bg = "#141414" }

[filetype]
rules = [
  { url = "*/", fg = "#acd5fc", bold = true },
  { mime = "image/*", fg = "#f5cfa9" },
  { mime = "video/*", fg = "#f5cfa9" },
  { mime = "audio/*", fg = "#f5cfa9" },
  { mime = "application/zip", fg = "#b5b5ff" },
  { mime = "application/gzip", fg = "#b5b5ff" },
  { mime = "application/x-tar", fg = "#b5b5ff" },
  { mime = "application/x-bzip2", fg = "#b5b5ff" },
  { mime = "application/x-7z-compressed", fg = "#b5b5ff" },
  { mime = "application/x-rar", fg = "#b5b5ff" },
  { url = "*.rs", fg = "#f5cfa9" },
  { url = "*.lua", fg = "#acd5fc" },
  { url = "*.ts", fg = "#acd5fc" },
  { url = "*.js", fg = "#f5cfa9" },
  { url = "*.py", fg = "#afd7af" },
  { url = "*.go", fg = "#d7d7ff" },
  { url = "*.md", fg = "#929498" },
  { url = "*.json", fg = "#f5cfa9" },
  { url = "*.toml", fg = "#f5cfa9" },
  { url = "*.yaml", fg = "#b5b5ff" },
  { url = "*.yml", fg = "#b5b5ff" },
]



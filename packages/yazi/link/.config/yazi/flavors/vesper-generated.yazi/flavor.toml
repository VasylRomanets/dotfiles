# Vesper

[mgr]
cwd = { fg = "#ea83a5" }
find_keyword = { fg = "#e6b99d", bold = true }
find_position = { fg = "#ea83a5", italic = true }
symlink_target = { fg = "#8b8b8b", italic = true }
marker_copied = { fg = "#90b99f", bg = "#90b99f" }
marker_cut = { fg = "#f5a191", bg = "#f5a191" }
marker_marked = { fg = "#e29eca", bg = "#e29eca" }
marker_selected = { fg = "#ea83a5", bg = "#ea83a5" }
count_copied = { fg = "#101010", bg = "#90b99f" }
count_cut = { fg = "#101010", bg = "#f5a191" }
count_selected = { fg = "#101010", bg = "#ea83a5" }
border_style = { fg = "#454545" }

[tabs]
active = { fg = "#ffffff", bg = "#1e1e1e" }
inactive = { fg = "#8b8b8b", bg = "#0b0b0b" }

[mode]
normal_main = { fg = "#101010", bg = "#ea83a5", bold = true }
normal_alt = { fg = "#ea83a5", bg = "#1e1e1e" }
select_main = { fg = "#101010", bg = "#e29eca", bold = true }
select_alt = { fg = "#e29eca", bg = "#1e1e1e" }
unset_main = { fg = "#101010", bg = "#ecaad6", bold = true }
unset_alt = { fg = "#ecaad6", bg = "#1e1e1e" }

[indicator]
parent = { bg = "#1e1e1e" }
current = { bg = "#313131" }
preview = { bg = "#1e1e1e" }

[status]
overall = { fg = "#ffffff", bg = "#1e1e1e" }
perm_sep = { fg = "#454545" }
perm_type = { fg = "#f591b2" }
perm_read = { fg = "#e6b99d" }
perm_write = { fg = "#ecaad6" }
perm_exec = { fg = "#90b99f" }
progress_label = { fg = "#ffffff", bold = true }
progress_normal = { fg = "#ea83a5", bg = "#1e1e1e" }
progress_error = { fg = "#101010", bg = "#f5a191" }

[which]
mask = { bg = "#0b0b0b" }
cand = { fg = "#ea83a5" }
rest = { fg = "#8b8b8b" }
desc = { fg = "#ababab" }
separator_style = { fg = "#454545" }

[confirm]
border = { fg = "#ea83a5" }
title = { fg = "#ea83a5" }
body = { fg = "#ffffff" }
list = { fg = "#ababab" }
btn_yes = { fg = "#101010", bg = "#ea83a5", bold = true }
btn_no = { fg = "#ababab" }

[spot]
border = { fg = "#ea83a5" }
title = { fg = "#ea83a5" }
tbl_col = { fg = "#f591b2" }
tbl_cell = { fg = "#101010", bg = "#ea83a5" }

[notify]
title_info = { fg = "#aca1cf" }
title_warn = { fg = "#e6b99d" }
title_error = { fg = "#f5a191" }

[pick]
border = { fg = "#ea83a5" }
active = { fg = "#ea83a5", bold = true }
inactive = { fg = "#ababab" }

[input]
border = { fg = "#ea83a5" }
title = { fg = "#ea83a5" }
value = { fg = "#ffffff" }
selected = { bg = "#313131" }

[cmp]
border = { fg = "#ea83a5" }
active = { fg = "#101010", bg = "#ea83a5" }
inactive = { fg = "#ababab" }

[tasks]
border = { fg = "#ea83a5" }
title = { fg = "#ea83a5" }
hovered = { fg = "#ea83a5", bold = true }

[help]
on = { fg = "#ea83a5" }
run = { fg = "#ababab" }
desc = { fg = "#8b8b8b" }
hovered = { bg = "#313131", bold = true }
footer = { fg = "#8b8b8b", bg = "#0b0b0b" }

[filetype]
rules = [
  { url = "*/", fg = "#ea83a5", bold = true },
  { mime = "image/*", fg = "#ffc799" },
  { mime = "video/*", fg = "#e6b99d" },
  { mime = "audio/*", fg = "#e6b99d" },
  { mime = "application/zip", fg = "#e29eca" },
  { mime = "application/gzip", fg = "#e29eca" },
  { mime = "application/x-tar", fg = "#e29eca" },
  { mime = "application/x-bzip2", fg = "#e29eca" },
  { mime = "application/x-7z-compressed", fg = "#e29eca" },
  { mime = "application/x-rar", fg = "#e29eca" },
  { url = "*.rs", fg = "#ffc799" },
  { url = "*.lua", fg = "#ea83a5" },
  { url = "*.ts", fg = "#ea83a5" },
  { url = "*.js", fg = "#e6b99d" },
  { url = "*.py", fg = "#90b99f" },
  { url = "*.go", fg = "#f591b2" },
  { url = "*.md", fg = "#ababab" },
  { url = "*.json", fg = "#e6b99d" },
  { url = "*.toml", fg = "#ffc799" },
  { url = "*.yaml", fg = "#ecaad6" },
  { url = "*.yml", fg = "#ecaad6" },
]


